<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mock Test | AIMERS CLASSES</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">A</span><span><b>AIMERS</b><small>CLASSES</small></span></a><nav><a href="index.html">Home</a><a href="materials.html">Study Material</a></nav></div></header>
<section class="page-hero"><div class="container"><span class="pill">DEMO TEST</span><h1>Online Mock Test</h1><p>Try the sample MCQ test.</p></div></section>
<section class="section"><div class="container test-wrap"><div class="timer">Time Left: <b id="timer">05:00</b></div><form id="quiz">
<div class="question"><b>1. Which planet is known as the Red Planet?</b><label><input type="radio" name="q1" value="A"> Earth</label><label><input type="radio" name="q1" value="B"> Mars</label><label><input type="radio" name="q1" value="C"> Venus</label><label><input type="radio" name="q1" value="D"> Jupiter</label></div>
<div class="question"><b>2. 15 + 27 = ?</b><label><input type="radio" name="q2" value="A"> 32</label><label><input type="radio" name="q2" value="B"> 40</label><label><input type="radio" name="q2" value="C"> 42</label><label><input type="radio" name="q2" value="D"> 45</label></div>
<div class="question"><b>3. What is the capital of Odisha?</b><label><input type="radio" name="q3" value="A"> Cuttack</label><label><input type="radio" name="q3" value="B"> Rourkela</label><label><input type="radio" name="q3" value="C"> Sambalpur</label><label><input type="radio" name="q3" value="D"> Bhubaneswar</label></div>
<button class="btn primary" type="submit">Submit Test</button></form><div id="result" class="result"></div></div></section>
<script>
let seconds=300; const t=document.getElementById('timer'); const quiz=document.getElementById('quiz'); const result=document.getElementById('result');
const answers={q1:'B',q2:'C',q3:'D'};
const interval=setInterval(()=>{seconds--;let m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');t.textContent=m+':'+s;if(seconds<=0){clearInterval(interval);quiz.requestSubmit()}},1000);
quiz.addEventListener('submit',e=>{e.preventDefault();clearInterval(interval);let score=0;for(const q in answers){const a=quiz.querySelector('input[name="'+q+'"]:checked');if(a&&a.value===answers[q])score++;}result.innerHTML='<h2>Your Score: '+score+' / 3</h2><p>Thank you for taking the AIMERS CLASSES mock test.</p>';result.scrollIntoView({behavior:'smooth'});});
</script>
</body></html>
