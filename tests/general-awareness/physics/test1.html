/* =========================================================
   TEST ENGINE
   ========================================================= */

let currentQuestion = 0;

let answers = new Array(questions.length).fill(null);

let submitted = false;

let totalSeconds = 60 * 60;


/* ================= TIMER ================= */

function updateTimer(){

    if(submitted) return;

    let minutes = Math.floor(totalSeconds / 60);

    let seconds = totalSeconds % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");

    if(totalSeconds <= 0){

        clearInterval(timerInterval);

        submitTest(true);

        return;
    }

    totalSeconds--;

}

const timerInterval = setInterval(updateTimer,1000);


/* ================= SHOW QUESTION ================= */

function showQuestion(){

    const q = questions[currentQuestion];

    document.getElementById("questionCount").textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    document.getElementById("question").textContent = q.q;

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.o.forEach(function(option){

        const label = document.createElement("label");

        label.className = "option";

        const radio = document.createElement("input");

        radio.type = "radio";

        radio.name = "answer";

        radio.value = option;

        if(answers[currentQuestion] === option){

            radio.checked = true;

        }

        radio.addEventListener("change",function(){

            answers[currentQuestion] = option;

            createPalette();

        });

        label.appendChild(radio);

        label.appendChild(
            document.createTextNode(option)
        );

        optionsDiv.appendChild(label);

    });

    createPalette();

}


/* ================= PALETTE ================= */

function createPalette(){

    const palette = document.getElementById("palette");

    palette.innerHTML = "";

    questions.forEach(function(_,index){

        const button = document.createElement("button");

        button.textContent = index + 1;

        if(answers[index] !== null){

            button.classList.add("attempted");

        }

        button.onclick = function(){

            currentQuestion = index;

            showQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        palette.appendChild(button);

    });

}


/* ================= NEXT ================= */

function nextQuestion(){

    if(currentQuestion < questions.length - 1){

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* ================= PREVIOUS ================= */

function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* ================= SUBMIT ================= */

function submitTest(autoSubmit){

    if(submitted) return;

    if(!autoSubmit){

        const confirmation = confirm(
            "Are you sure you want to submit the Physics Test?"
        );

        if(!confirmation) return;

    }

    submitted = true;

    clearInterval(timerInterval);

    let correct = 0;

    let wrong = 0;

    let unattempted = 0;

    questions.forEach(function(question,index){

        if(answers[index] === null){

            unattempted++;

        }

        else if(answers[index] === question.a){

            correct++;

        }

        else{

            wrong++;

        }

    });

    let score = correct - (wrong / 3);

    document.getElementById("testArea")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "block";

    document.getElementById("score")
        .textContent = score.toFixed(2);

    document.getElementById("correct")
        .textContent = correct;

    document.getElementById("wrong")
        .textContent = wrong;

    document.getElementById("unattempted")
        .textContent = unattempted;

    showSolutions();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ================= SOLUTIONS ================= */

function showSolutions(){

    const review = document.getElementById("review");

    review.innerHTML = "";

    questions.forEach(function(question,index){

        const div = document.createElement("div");

        let statusClass = "";

        let statusText = "";

        if(answers[index] === null){

            statusClass = "unattempted-review";

            statusText =
                '<span class="unattempted">⚪ Not Attempted</span>';

        }

        else if(answers[index] === question.a){

            statusClass = "correct-review";

            statusText =
                '<span class="correct">✓ Correct</span>';

        }

        else{

            statusClass = "wrong-review";

            statusText =
                '<span class="wrong">✗ Wrong</span>';

        }

        let userAnswer =
            answers[index] === null
            ? "Not Attempted"
            : answers[index];

        div.className = "review " + statusClass;

        div.innerHTML =

            '<div class="review-question">' +
            'Q' + (index + 1) + '. ' +
            question.q +
            '</div>' +

            '<div>' +
            statusText +
            '</div>' +

            '<div style="margin-top:7px;">' +
            '<b>Your Answer:</b> ' +
            userAnswer +
            '</div>' +

            '<div class="correct-answer">' +
            'Correct Answer: ' +
            question.a +
            '</div>' +

            '<div class="solution">' +
            '<strong>💡 Solution:</strong><br>' +
            question.s +
            '</div>';

        review.appendChild(div);

    });

}

showQuestion();
