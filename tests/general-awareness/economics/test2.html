let currentQuestion = 0;
let userAnswers = new Array(questions.length).fill(null);
let timeLeft = 100 * 60;
let testSubmitted = false;


/* TIMER */

const timerElement = document.getElementById("timer");

const timerInterval = setInterval(function(){

    if(testSubmitted){
        clearInterval(timerInterval);
        return;
    }

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    timerElement.textContent =
        String(minutes).padStart(2,"0") + ":" +
        String(seconds).padStart(2,"0");

    if(timeLeft <= 0){
        clearInterval(timerInterval);
        submitTest(true);
        return;
    }

    timeLeft--;

},1000);


/* DISPLAY QUESTION */

function displayQuestion(){

    const q = questions[currentQuestion];

    let html = "";

    html += `
        <div class="question-number">
            Question ${currentQuestion + 1} of ${questions.length}
        </div>

        <div class="question">
            ${q.q}
        </div>
    `;

    q.options.forEach((option,index)=>{

        const checked =
            userAnswers[currentQuestion] === index
            ? "checked"
            : "";

        html += `
        <label class="option">

            <input
                type="radio"
                name="answer"
                value="${index}"
                ${checked}
                onchange="selectAnswer(${index})"
            >

            <strong>${String.fromCharCode(65+index)}.</strong>
            ${option}

        </label>
        `;

    });


    html += `
        <div class="navigation">

            <button
                class="prev"
                onclick="previousQuestion()"
                ${currentQuestion === 0 ? "disabled" : ""}
            >
                Previous
            </button>

            <button
                class="next"
                onclick="nextQuestion()"
            >
                ${currentQuestion === questions.length-1
                    ? "Finish"
                    : "Next"}
            </button>

        </div>
    `;

    document.getElementById("quizBox").innerHTML = html;

    updateNavigator();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* SELECT ANSWER */

function selectAnswer(index){

    userAnswers[currentQuestion] = index;

    updateNavigator();
}


/* NEXT */

function nextQuestion(){

    if(currentQuestion < questions.length - 1){

        currentQuestion++;

        displayQuestion();

    }else{

        submitTest();

    }
}


/* PREVIOUS */

function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        displayQuestion();

    }
}


/* QUESTION NAVIGATOR */

function createNavigator(){

    const grid =
        document.getElementById("questionGrid");

    grid.innerHTML = "";

    questions.forEach((q,index)=>{

        const button =
            document.createElement("button");

        button.className = "qbtn";

        button.textContent = index + 1;

        button.onclick = function(){

            currentQuestion = index;

            displayQuestion();

        };

        grid.appendChild(button);

    });

    updateNavigator();
}


function updateNavigator(){

    const buttons =
        document.querySelectorAll(".qbtn");

    buttons.forEach((button,index)=>{

        button.classList.remove(
            "active",
            "attempted"
        );

        if(userAnswers[index] !== null){

            button.classList.add("attempted");

        }

        if(index === currentQuestion){

            button.classList.add("active");

        }

    });
}


/* SUBMIT */

function submitTest(autoSubmit=false){

    if(testSubmitted) return;

    if(!autoSubmit){

        const unanswered =
            userAnswers.filter(a => a === null).length;

        if(unanswered > 0){

            const confirmSubmit =
                confirm(
                    "You have " +
                    unanswered +
                    " unanswered question(s). Do you want to submit the test?"
                );

            if(!confirmSubmit){
                return;
            }

        }else{

            const confirmSubmit =
                confirm(
                    "Are you sure you want to submit the test?"
                );

            if(!confirmSubmit){
                return;
            }

        }

    }

    testSubmitted = true;

    clearInterval(timerInterval);

    calculateResult();

}


/* RESULT */

function calculateResult(){

    let correct = 0;
    let wrong = 0;
    let unanswered = 0;

    questions.forEach((q,index)=>{

        if(userAnswers[index] === null){

            unanswered++;

        }else if(userAnswers[index] === q.answer){

            correct++;

        }else{

            wrong++;

        }

    });


    const marks =
        (correct * 2) -
        (wrong * 0.5);

    const percentage =
        ((correct / questions.length) * 100).toFixed(2);


    document.getElementById("quizBox").style.display = "none";

    document.getElementById("result").style.display = "block";


    document.getElementById("score").innerHTML =
        `${marks.toFixed(2)} / 200`;


    document.getElementById("details").innerHTML =

        `
        <b>Correct:</b> ${correct}
        &nbsp; | &nbsp;

        <b>Wrong:</b> ${wrong}
        &nbsp; | &nbsp;

        <b>Unanswered:</b> ${unanswered}
        <br><br>

        <b>Percentage:</b> ${percentage}%

        <br>

        <small>
        Marking Scheme: +2 for correct, -0.5 for wrong
        </small>
        `;


    generateReview();

    document.querySelector(".sidebar").style.display = "none";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* SOLUTION REVIEW */

function generateReview(){

    const review =
        document.getElementById("review");

    review.innerHTML = "";

    questions.forEach((q,index)=>{

        const user =
            userAnswers[index];

        let status = "";

        if(user === null){

            status =
                `<div class="wrong">
                    Not Attempted
                </div>`;

        }else if(user === q.answer){

            status =
                `<div class="correct">
                    Correct
                </div>`;

        }else{

            status =
                `<div class="wrong">
                    Wrong
                </div>`;

        }


        let userText =
            user === null
            ? "Not Attempted"
            : q.options[user];

        let correctText =
            q.options[q.answer];


        const div =
            document.createElement("div");

        div.className = "review-item";

        div.innerHTML = `

            <strong>
                Q${index+1}. ${q.q}
            </strong>

            <br><br>

            ${status}

            <br>

            <b>Your Answer:</b>
            ${userText}

            <br>

            <b>Correct Answer:</b>
            ${correctText}

            <div class="solution">

                <b>Solution:</b>
                ${q.solution}

            </div>

        `;

        review.appendChild(div);

    });

}


/* START */

createNavigator();

displayQuestion();
