/* ===============================
   TEST ENGINE
================================ */

let current = 0;

let answers = new Array(questions.length).fill(null);

let submitted = false;

let seconds = 3600;


/* SHOW QUESTION */

function show(){

    let q = questions[current];

    document.getElementById("count").textContent =
        "Question " + (current + 1) +
        " of " + questions.length;

    document.getElementById("question").textContent =
        q.q;

    let box =
        document.getElementById("options");

    box.innerHTML = "";

    q.o.forEach(function(opt){

        let label =
            document.createElement("label");

        label.className = "option";

        let input =
            document.createElement("input");

        input.type = "radio";

        input.name = "answer";

        input.value = opt;

        if(answers[current] === opt){

            input.checked = true;

        }

        input.onchange = function(){

            answers[current] = opt;

            palette();

        };

        label.appendChild(input);

        label.appendChild(
            document.createTextNode(opt)
        );

        box.appendChild(label);

    });

    palette();

}


/* PALETTE */

function palette(){

    let p =
        document.getElementById("palette");

    p.innerHTML = "";

    questions.forEach(function(q,i){

        let b =
            document.createElement("button");

        b.textContent = i + 1;

        if(answers[i] !== null){

            b.classList.add("done");

        }

        b.onclick = function(){

            current = i;

            show();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        p.appendChild(b);

    });

}


/* NEXT */

function next(){

    if(current < questions.length - 1){

        current++;

        show();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* PREVIOUS */

function previous(){

    if(current > 0){

        current--;

        show();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* TIMER */

function timer(){

    if(submitted)return;

    let m =
        Math.floor(seconds / 60);

    let s =
        seconds % 60;

    document.getElementById("timer")
        .textContent =
        String(m).padStart(2,"0")
        + ":" +
        String(s).padStart(2,"0");

    if(seconds <= 0){

        submitTest(true);

        return;

    }

    seconds--;

}

setInterval(timer,1000);


/* SUBMIT */

function submitTest(auto){

    if(submitted)return;

    if(!auto){

        if(!confirm(
            "Are you sure you want to submit Chemistry Test 1?"
        )){

            return;

        }

    }

    submitted = true;

    let correct = 0;

    let wrong = 0;

    let na = 0;


    questions.forEach(function(q,i){

        if(answers[i] === null){

            na++;

        }
        else if(answers[i] === q.a){

            correct++;

        }
        else{

            wrong++;

        }

    });


    let score =
        correct - (wrong / 3);


    document.getElementById("test")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "block";


    document.getElementById("score")
        .textContent =
        score.toFixed(2);

    document.getElementById("correct")
        .textContent =
        correct;

    document.getElementById("wrong")
        .textContent =
        wrong;

    document.getElementById("na")
        .textContent =
        na;


    showReview();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* SOLUTIONS */

function showReview(){

    let r =
        document.getElementById("review");

    r.innerHTML = "";


    questions.forEach(function(q,i){

        let div =
            document.createElement("div");


        let cls = "";

        let status = "";


        if(answers[i] === null){

            cls = "rNA";

            status =
                '<b style="color:#d97706">⚪ Not Attempted</b>';

        }

        else if(answers[i] === q.a){

            cls = "rCorrect";

            status =
                '<b style="color:#15803d">✓ Correct</b>';

        }

        else{

            cls = "rWrong";

            status =
                '<b style="color:#dc2626">✗ Wrong</b>';

        }


        div.className =
            "review " + cls;


        div.innerHTML =

            "<b>Q" +
            (i+1) +
            ". " +
            q.q +
            "</b><br><br>" +

            status +

            "<br><b>Your Answer:</b> " +

            (
                answers[i] === null
                ?
                "Not Attempted"
                :
                answers[i]
            ) +

            '<div class="ca">' +

            "Correct Answer: " +

            q.a +

            "</div>" +

            '<div class="sol">' +

            "<b>💡 Solution:</b><br>" +

            q.s +

            "</div>";


        r.appendChild(div);

    });

}


/* START */

show();
