let currentQuestion = 0;
let answers = new Array(questions.length).fill(null);
let submitted = false;
let timeLeft = 60 * 60;

const questionText =
document.getElementById("questionText");

const questionNumber =
document.getElementById("questionNumber");

const optionsDiv =
document.getElementById("options");

const palette =
document.getElementById("palette");


function loadQuestion(){

    const q = questions[currentQuestion];

    questionNumber.innerText =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    questionText.innerText = q.q;

    optionsDiv.innerHTML = "";

    q.o.forEach((option,index)=>{

        const label =
        document.createElement("label");

        label.className =
            "option" +
            (answers[currentQuestion] === index
            ? " selected"
            : "");

        label.innerHTML =
        `<input type="radio"
        name="question"
        value="${index}">
        <b>${String.fromCharCode(65+index)}.</b>
        ${option}`;

        label.onclick = function(){

            answers[currentQuestion] = index;

            document
            .querySelectorAll(".option")
            .forEach(x =>
                x.classList.remove("selected")
            );

            label.classList.add("selected");

            updatePalette();

        };

        optionsDiv.appendChild(label);

    });

    updatePalette();
}


function createPalette(){

    palette.innerHTML = "";

    questions.forEach((q,index)=>{

        const btn =
        document.createElement("button");

        btn.className = "p-btn";

        btn.innerText = index + 1;

        btn.onclick = function(){

            currentQuestion = index;

            loadQuestion();

        };

        palette.appendChild(btn);

    });

}


function updatePalette(){

    const buttons =
    document.querySelectorAll(".p-btn");

    buttons.forEach((btn,index)=>{

        btn.classList.remove("current");
        btn.classList.remove("attempted");

        if(answers[index] !== null){
            btn.classList.add("attempted");
        }

        if(index === currentQuestion){
            btn.classList.add("current");
        }

    });

}


function nextQuestion(){

    if(currentQuestion <
       questions.length - 1){

        currentQuestion++;

        loadQuestion();

    }

}


function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        loadQuestion();

    }

}


function submitTest(){

    if(submitted) return;

    const unanswered =
    answers.filter(x => x === null).length;

    const confirmSubmit =
    confirm(
        "Are you sure you want to submit the test?\n\n" +
        "Attempted: " +
        (questions.length - unanswered) +
        "\nNot Attempted: " +
        unanswered
    );

    if(!confirmSubmit) return;

    submitted = true;

    clearInterval(timerInterval);

    let correct = 0;

    questions.forEach((q,index)=>{

        if(answers[index] === q.a){
            correct++;
        }

    });

    const attempted =
    questions.length - unanswered;

    const wrong =
    attempted - correct;

    const percentage =
    ((correct / questions.length) * 100)
    .toFixed(2);

    document.getElementById("quiz")
    .style.display = "none";

    document.getElementById("result")
    .style.display = "block";

    document.getElementById("score")
    .innerHTML =
    `Score: ${correct} / ${questions.length}
    <br>
    Percentage: ${percentage}%
    <br>
    Attempted: ${attempted}
    | Wrong: ${wrong}
    | Not Attempted: ${unanswered}`;

    showReview();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function showReview(){

    const review =
    document.getElementById("review");

    review.innerHTML = "";

    questions.forEach((q,index)=>{

        const div =
        document.createElement("div");

        div.className = "review";

        let status = "";

        if(answers[index] === null){

            status =
            `<div class="wrong">
            Not Attempted
            </div>`;

        }
        else if(answers[index] === q.a){

            status =
            `<div class="correct">
            ✓ Correct
            </div>`;

        }
        else{

            status =
            `<div class="wrong">
            ✗ Wrong
            </div>`;

        }

        div.innerHTML = `

        <div class="review-question">
        Q${index+1}. ${q.q}
        </div>

        ${status}

        <div>
        <b>Your Answer:</b>
        ${
            answers[index] === null
            ? "Not Attempted"
            : q.o[answers[index]]
        }
        </div>

        <div class="correct">
        <b>Correct Answer:</b>
        ${q.o[q.a]}
        </div>

        <div class="solution">
        <b>Solution:</b>
        ${q.s}
        </div>

        `;

        review.appendChild(div);

    });

}


function updateTimer(){

    let minutes =
    Math.floor(timeLeft / 60);

    let seconds =
    timeLeft % 60;

    document.getElementById("timer")
    .innerText =
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");

    if(timeLeft <= 0){

        clearInterval(timerInterval);

        if(!submitted){

            alert(
                "Time is over. Your test will be submitted automatically."
            );

            submitTest();

        }

        return;

    }

    timeLeft--;

}


createPalette();

loadQuestion();

updateTimer();

const timerInterval =
setInterval(updateTimer,1000);

</script>
