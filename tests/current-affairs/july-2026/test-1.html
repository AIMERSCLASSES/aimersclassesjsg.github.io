/* 
   The question bank above intentionally contains more than 100
   exam-ready questions. Test 1 uses the first 100 questions.
*/

const testQuestions = questions.slice(0,100);

let submitted=false;
let timeLeft=60*60;
let timerInterval;

function loadQuiz(){

    const quiz=document.getElementById("quiz");
    const grid=document.getElementById("questionGrid");

    quiz.innerHTML="";
    grid.innerHTML="";

    testQuestions.forEach((item,index)=>{

        const card=document.createElement("div");
        card.className="question-card";
        card.id="question-"+index;

        let html=`
            <div class="qno">Question ${index+1}</div>
            <div class="question">${item.q}</div>
        `;

        item.o.forEach((option,optIndex)=>{
            html+=`
            <label class="option" id="option-${index}-${optIndex}">
                <input type="radio"
                       name="q${index}"
                       value="${optIndex}"
                       onchange="markAttempted(${index})">
                ${String.fromCharCode(65+optIndex)}. ${option}
            </label>`;
        });

        html+=`
        <div class="solution" id="solution-${index}">
            <b>Correct Answer:</b>
            ${String.fromCharCode(65+item.a)}. ${item.o[item.a]}
            <div class="explanation">
                <b>Explanation:</b> ${item.e}
            </div>
        </div>`;

        card.innerHTML=html;
        quiz.appendChild(card);

        const btn=document.createElement("button");
        btn.className="qbtn";
        btn.id="qbtn-"+index;
        btn.innerText=index+1;

        btn.onclick=()=>{
            document.getElementById("question-"+index)
            .scrollIntoView({behavior:"smooth",block:"center"});
        };

        grid.appendChild(btn);
    });
}

function markAttempted(index){
    document.getElementById("qbtn-"+index)
    .classList.add("attempted");
}

function startTimer(){

    timerInterval=setInterval(()=>{

        if(timeLeft<=0){
            clearInterval(timerInterval);
            submitTest();
            return;
        }

        timeLeft--;

        let min=Math.floor(timeLeft/60);
        let sec=timeLeft%60;

        document.getElementById("timer").innerText=
            String(min).padStart(2,"0")+":"+
            String(sec).padStart(2,"0");

    },1000);
}

function submitTest(){

    if(submitted) return;

    if(!confirm("Are you sure you want to submit the test?")){
        return;
    }

    submitted=true;
    clearInterval(timerInterval);

    let correct=0;
    let wrong=0;
    let attempted=0;

    testQuestions.forEach((item,index)=>{

        const selected=document.querySelector(
            `input[name="q${index}"]:checked`
        );

        if(selected){

            attempted++;

            const selectedValue=parseInt(selected.value);

            if(selectedValue===item.a){
                correct++;
            }else{
                wrong++;
            }
        }
    });

    const unattempted=testQuestions.length-attempted;

    const score=(correct-(wrong*0.33));

    document.getElementById("result").style.display="block";

    document.getElementById("score").innerText=
        "Score: "+score.toFixed(2)+" / 100";

    document.getElementById("details").innerHTML=
        "<b>Correct:</b> "+correct+
        " &nbsp; | &nbsp; "+
        "<b>Wrong:</b> "+wrong+
        " &nbsp; | &nbsp; "+
        "<b>Unattempted:</b> "+unattempted+
        "<br><br>"+
        "<b>Negative Marking:</b> −0.33 per wrong answer";

    testQuestions.forEach((item,index)=>{

        const selected=document.querySelector(
            `input[name="q${index}"]:checked`
        );

        document
        .querySelectorAll(`#question-${index} .option`)
        .forEach((label,optIndex)=>{

            if(optIndex===item.a){
                label.classList.add("correct");
            }

            if(selected &&
               parseInt(selected.value)===optIndex &&
               optIndex!==item.a){

                label.classList.add("wrong");
            }

        });
    });

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function showSolutions(){

    testQuestions.forEach((item,index)=>{
        document.getElementById("solution-"+index)
        .style.display="block";
    });
}

loadQuiz();
startTimer();
