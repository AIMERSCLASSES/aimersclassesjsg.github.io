let currentQuestion = 0;

let answers =
    new Array(questions.length).fill(null);

let submitted = false;

let totalSeconds = 45 * 60;

let timerInterval;


/* TIMER */

function startTimer(){

    timerInterval = setInterval(function(){

        if(totalSeconds <= 0){

            clearInterval(timerInterval);

            submitTest(true);

            return;
        }

        totalSeconds--;

        let minutes =
            Math.floor(totalSeconds / 60);

        let seconds =
            totalSeconds % 60;

        document.getElementById("timer").textContent =
            String(minutes).padStart(2,"0") +
            ":" +
            String(seconds).padStart(2,"0");

    },1000);
}


/* LOAD QUESTION */

function loadQuestion(){

    const q = questions[currentQuestion];

    document.getElementById("currentNo").textContent =
        currentQuestion + 1;

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1);

    document.getElementById("questionText").textContent =
        q.q;

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    q.o.forEach((option,index)=>{

        const label =
            document.createElement("label");

        const input =
            document.createElement("input");

        input.type = "radio";

        input.name = "answer";

        input.value = index;

        if(answers[currentQuestion] === index){

            input.checked = true;

        }

        input.addEventListener(
            "change",
            function(){

                answers[currentQuestion] = index;

                updatePalette();

            }
        );

        label.appendChild(input);

        label.appendChild(
            document.createTextNode(
                String.fromCharCode(65 + index) +
                ". " +
                option
            )
        );

        options.appendChild(label);

    });

    document.getElementById("prevBtn").disabled =
        currentQuestion === 0;

    document.getElementById("nextBtn").disabled =
        currentQuestion === questions.length - 1;

    updatePalette();
}


/* PALETTE */

function createPalette(){

    const grid =
        document.getElementById("questionGrid");

    grid.innerHTML = "";

    questions.forEach((q,index)=>{

        const btn =
            document.createElement("button");

        btn.className = "qbtn";

        btn.textContent = index + 1;

        btn.onclick = function(){

            currentQuestion = index;

            loadQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        grid.appendChild(btn);

    });

    updatePalette();
}


function updatePalette(){

    const buttons =
        document.querySelectorAll(".qbtn");

    buttons.forEach((btn,index)=>{

        btn.className = "qbtn";

        if(index === currentQuestion){

            btn.classList.add("current");

        }

        if(answers[index] !== null){

            btn.classList.add("attempted");

        }

    });
}


/* NEXT */

function nextQuestion(){

    if(currentQuestion <
       questions.length - 1){

        currentQuestion++;

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
}


/* PREVIOUS */

function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
}


/* SUBMIT */

function submitTest(autoSubmit=false){

    if(submitted) return;


    if(!autoSubmit){

        const unanswered =
            answers.filter(
                a => a === null
            ).length;

        if(unanswered > 0){

            const confirmSubmit =
                confirm(
                    "You have " +
                    unanswered +
                    " unanswered question(s).\n\n" +
                    "Correct: +1 mark\n" +
                    "Wrong: -0.33 mark\n" +
                    "Unattempted: 0 mark\n\n" +
                    "Do you want to submit?"
                );

            if(!confirmSubmit) return;

        }

    }


    submitted = true;

    clearInterval(timerInterval);


    let correct = 0;

    let wrong = 0;

    let attempted = 0;


    questions.forEach((q,index)=>{

        if(answers[index] !== null){

            attempted++;

            if(answers[index] === q.a){

                correct++;

            }else{

                wrong++;

            }

        }

    });


    let unattempted =
        questions.length - attempted;


    /* NEGATIVE MARKING */

    let negativeMarks =
        wrong * 0.33;


    let finalScore =
        correct - negativeMarks;


    finalScore =
        Math.max(0,finalScore);


    let percentage =
        ((finalScore / questions.length) * 100)
        .toFixed(2);


    let resultHTML = `

        <h2>Test Result</h2>

        <div class="negative-info">
            Negative Marking: 0.33 mark for every wrong answer
        </div>

        <div class="score">
            Final Score: ${finalScore.toFixed(2)} / 100
        </div>

        <div class="result-card">

            <p>
                <strong>Correct Answers:</strong>
                ${correct} × 1 = ${(correct).toFixed(2)}
            </p>

            <p>
                <strong>Wrong Answers:</strong>
                ${wrong} × 0.33 = -${negativeMarks.toFixed(2)}
            </p>

            <p>
                <strong>Unattempted:</strong>
                ${unattempted} × 0 = 0
            </p>

            <hr style="margin:10px 0;">

            <p>
                <strong>Final Marks:</strong>
                ${correct} - ${negativeMarks.toFixed(2)}
                = ${finalScore.toFixed(2)}
            </p>

            <p>
                <strong>Percentage:</strong>
                ${percentage}%
            </p>

            <p>
                <strong>Attempted:</strong>
                ${attempted}
            </p>

        </div>

        <h3>Detailed Solutions</h3>
    `;


    questions.forEach((q,index)=>{

        const userAnswer =
            answers[index];

        let status = "";

        if(userAnswer === null){

            status =
                `<span class="unattempted">
                    Not Attempted
                </span>`;

        }
        else if(userAnswer === q.a){

            status =
                `<span class="correct">
                    Correct (+1)
                </span>`;

        }
        else{

            status =
                `<span class="wrong">
                    Wrong (-0.33)
                </span>`;

        }


        resultHTML += `

        <div class="explanation">

            <p>
                <strong>
                    Q${index + 1}. ${q.q}
                </strong>
            </p>

            <p>
                ${status}
            </p>

            <p>
                <strong>Your Answer:</strong>
                ${
                    userAnswer === null
                    ? "Not Attempted"
                    : q.o[userAnswer]
                }
            </p>

            <p>
                <strong>Correct Answer:</strong>
                ${q.o[q.a]}
            </p>

            <p>
                <strong>Solution:</strong>
                ${q.e}
            </p>

        </div>

        `;

    });


    const result =
        document.getElementById("result");

    result.innerHTML = resultHTML;

    result.style.display = "block";


    document.getElementById("questionBox")
        .style.display = "none";


    document.querySelector(".submit")
        .style.display = "none";


    result.scrollIntoView({
        behavior:"smooth"
    });

}


createPalette();

loadQuestion();

startTimer();

</script>
