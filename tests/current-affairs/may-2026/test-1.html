let currentQuestion = 0;
let answers = new Array(questions.length).fill(null);
let submitted = false;

let totalSeconds = 45 * 60;
let timerInterval;

function startTimer(){

    timerInterval = setInterval(function(){

        if(totalSeconds <= 0){

            clearInterval(timerInterval);

            submitTest(true);

            return;
        }

        totalSeconds--;

        let minutes = Math.floor(totalSeconds / 60);

        let seconds = totalSeconds % 60;

        document.getElementById("timer").textContent =
            String(minutes).padStart(2,"0") +
            ":" +
            String(seconds).padStart(2,"0");

    },1000);
}

function loadQuestion(){

    const q = questions[currentQuestion];

    document.getElementById("currentNo").textContent =
        currentQuestion + 1;

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1);

    document.getElementById("questionText").textContent =
        q.q;

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    q.o.forEach((option,index)=>{

        const label =
            document.createElement("label");

        const input =
            document.createElement("input");

        input.type = "radio";

        input.name = "answer";

        input.value = index;

        if(answers[currentQuestion] === index){

            input.checked = true;

        }

        input.addEventListener(
            "change",
            function(){

                answers[currentQuestion] = index;

                updatePalette();

            }
        );

        label.appendChild(input);

        label.appendChild(
            document.createTextNode(
                String.fromCharCode(65 + index) +
                ". " +
                option
            )
        );

        options.appendChild(label);

    });

    document.getElementById("prevBtn").disabled =
        currentQuestion === 0;

    document.getElementById("nextBtn").disabled =
        currentQuestion === questions.length - 1;

    updatePalette();
}

function createPalette(){

    const grid =
        document.getElementById("questionGrid");

    grid.innerHTML = "";

    questions.forEach((q,index)=>{

        const btn =
            document.createElement("button");

        btn.className = "qbtn";

        btn.textContent = index + 1;

        btn.onclick = function(){

            currentQuestion = index;

            loadQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        grid.appendChild(btn);

    });

    updatePalette();
}

function updatePalette(){

    const buttons =
        document.querySelectorAll(".qbtn");

    buttons.forEach((btn,index)=>{

        btn.className = "qbtn";

        if(index === currentQuestion){

            btn.classList.add("current");

        }

        if(answers[index] !== null){

            btn.classList.add("attempted");

        }

    });
}

function nextQuestion(){

    if(currentQuestion < questions.length - 1){

        currentQuestion++;

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}

function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}

function submitTest(autoSubmit=false){

    if(submitted) return;

    if(!autoSubmit){

        const unanswered =
            answers.filter(a => a === null).length;

        if(unanswered > 0){

            const confirmSubmit =
                confirm(
                    "You have " +
                    unanswered +
                    " unanswered question(s). Do you want to submit?"
                );

            if(!confirmSubmit) return;

        }

    }

    submitted = true;

    clearInterval(timerInterval);

    let score = 0;

    let attempted = 0;

    questions.forEach((q,index)=>{

        if(answers[index] !== null){

            attempted++;

            if(answers[index] === q.a){

                score++;

            }

        }

    });

    let wrong = attempted - score;

    let unattempted =
        questions.length - attempted;

    let percentage =
        ((score / questions.length) * 100).toFixed(2);

    let resultHTML = `

        <h2>Test Result</h2>

        <div class="score">
            Score: ${score} / ${questions.length}
        </div>

        <p>
            <strong>Percentage:</strong>
            ${percentage}%
        </p>

        <p>
            <strong>Attempted:</strong>
            ${attempted}
        </p>

        <p>
            <strong>Correct:</strong>
            ${score}
        </p>

        <p>
            <strong>Wrong:</strong>
            ${wrong}
        </p>

        <p>
            <strong>Unattempted:</strong>
            ${unattempted}
        </p>

        <hr style="margin:20px 0;">

        <h3>Detailed Solutions</h3>
    `;

    questions.forEach((q,index)=>{

        const userAnswer =
            answers[index];

        let status = "";

        if(userAnswer === null){

            status =
                `<span class="unattempted">
                    Not Attempted
                </span>`;

        }
        else if(userAnswer === q.a){

            status =
                `<span class="correct">
                    Correct
                </span>`;

        }
        else{

            status =
                `<span class="wrong">
                    Wrong
                </span>`;

        }

        resultHTML += `

        <div class="explanation">

            <p>
                <strong>
                    Q${index + 1}. ${q.q}
                </strong>
            </p>

            <p>${status}</p>

            <p>
                <strong>Your Answer:</strong>
                ${
                    userAnswer === null
                    ? "Not Attempted"
                    : q.o[userAnswer]
                }
            </p>

            <p>
                <strong>Correct Answer:</strong>
                ${q.o[q.a]}
            </p>

            <p>
                <strong>Solution:</strong>
                ${q.e}
            </p>

        </div>

        `;

    });

    const result =
        document.getElementById("result");

    result.innerHTML = resultHTML;

    result.style.display = "block";

    document.getElementById("questionBox").style.display =
        "none";

    document.querySelector(".submit").style.display =
        "none";

    result.scrollIntoView({
        behavior:"smooth"
    });

}

createPalette();

loadQuestion();

startTimer();

</script>
