let currentQuestion = 0;
let answers = new Array(questions.length).fill(null);
let submitted = false;

let totalSeconds = 90 * 60;

const questionsContainer =
document.getElementById("questionsContainer");

const paletteGrid =
document.getElementById("paletteGrid");

function renderQuestions(){

    questionsContainer.innerHTML = "";

    questions.forEach((item,index)=>{

        const card = document.createElement("div");

        card.className =
        "question-card" +
        (index === 0 ? " active" : "");

        let html = "";

        html += `
            <div class="question-number">
                Question ${index + 1}
            </div>

            <div class="question-text">
                ${item.q}
            </div>
        `;

        item.o.forEach((option,optIndex)=>{

            const checked =
            answers[index] === optIndex
            ? "checked"
            : "";

            html += `
            <label class="option"
                   id="option-${index}-${optIndex}">

                <input type="radio"
                       name="q${index}"
                       value="${optIndex}"
                       ${checked}
                       onchange="selectAnswer(${index},${optIndex})">

                ${String.fromCharCode(65+optIndex)}.
                ${option}

            </label>
            `;

        });

        card.innerHTML = html;

        questionsContainer.appendChild(card);

    });

}

function renderPalette(){

    paletteGrid.innerHTML = "";

    questions.forEach((q,index)=>{

        const btn =
        document.createElement("button");

        btn.textContent = index + 1;

        btn.onclick = ()=>{
            goToQuestion(index);
        };

        if(index === currentQuestion){
            btn.classList.add("current");
        }

        if(answers[index] !== null){
            btn.classList.add("attempted");
        }

        paletteGrid.appendChild(btn);

    });

}

function selectAnswer(index,value){

    answers[index] = Number(value);

    document
    .querySelectorAll(
        `input[name="q${index}"]`
    )
    .forEach(input=>{

        const label =
        input.parentElement;

        label.classList.remove("selected");

        if(Number(input.value) === Number(value)){
            label.classList.add("selected");
        }

    });

    renderPalette();

}

function goToQuestion(index){

    if(submitted) return;

    const cards =
    document.querySelectorAll(".question-card");

    cards[currentQuestion].classList.remove("active");

    currentQuestion = index;

    cards[currentQuestion].classList.add("active");

    renderPalette();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function nextQuestion(){

    if(currentQuestion < questions.length - 1){
        goToQuestion(currentQuestion + 1);
    }

}

function previousQuestion(){

    if(currentQuestion > 0){
        goToQuestion(currentQuestion - 1);
    }

}

function startTimer(){

    const timer =
    document.getElementById("timer");

    const interval =
    setInterval(()=>{

        if(submitted){
            clearInterval(interval);
            return;
        }

        let minutes =
        Math.floor(totalSeconds / 60);

        let seconds =
        totalSeconds % 60;

        timer.textContent =
        String(minutes).padStart(2,"0")
        + ":" +
        String(seconds).padStart(2,"0");

        if(totalSeconds <= 0){

            clearInterval(interval);

            alert(
                "Time is over. Your test will be submitted automatically."
            );

            submitTest();

            return;
        }

        totalSeconds--;

    },1000);

}

function submitTest(){

    if(submitted) return;

    const unattempted =
    answers.filter(a => a === null).length;

    if(unattempted > 0){

        const confirmSubmit =
        confirm(
            "You have " +
            unattempted +
            " unattempted question(s). Do you want to submit?"
        );

        if(!confirmSubmit){
            return;
        }

    }

    submitted = true;

    let correct = 0;
    let wrong = 0;

    questions.forEach((question,index)=>{

        if(answers[index] === null){
            return;
        }

        if(answers[index] === question.a){
            correct++;
        }else{
            wrong++;
        }

    });

    const score =
    correct - (wrong / 3);

    const percentage =
    (score / 100) * 100;

    document.getElementById("testLayout").style.display =
    "none";

    const result =
    document.getElementById("result");

    result.style.display = "block";

    let resultHTML = "";

    resultHTML += `
        <h2>Test Submitted Successfully</h2>

        <div class="score-box">

            <div class="score-item">
                Correct
                <strong>${correct}</strong>
            </div>

            <div class="score-item">
                Wrong
                <strong>${wrong}</strong>
            </div>

            <div class="score-item">
                Unattempted
                <strong>${unattempted}</strong>
            </div>

            <div class="score-item">
                Score
                <strong>${score.toFixed(2)}</strong>
            </div>

        </div>

        <p style="text-align:center;font-weight:bold;">
            Percentage: ${percentage.toFixed(2)}%
        </p>

        <hr>

        <h2 style="color:#102a43;">
            Detailed Solutions
        </h2>
    `;

    questions.forEach((question,index)=>{

        let statusClass = "unattempted";
        let statusText = "Not Attempted";

        if(answers[index] !== null){

            if(answers[index] === question.a){

                statusClass = "correct";
                statusText = "Correct";

            }else{

                statusClass = "wrong";
                statusText = "Wrong";

            }

        }

        const correctText =
        question.o[question.a];

        const yourText =
        answers[index] === null
        ? "Not Attempted"
        : question.o[answers[index]];

        resultHTML += `

        <div class="solution ${statusClass}">

            <div class="solution-title">
                Q${index+1}. ${question.q}
            </div>

            <div>
                <strong>Status:</strong>
                ${statusText}
            </div>

            <div class="your-answer">
                Your Answer:
                ${yourText}
            </div>

            <div class="correct-answer">
                Correct Answer:
                ${String.fromCharCode(65 + question.a)}.
                ${correctText}
            </div>

            <div class="explanation">
                <strong>Solution:</strong>
                ${question.e}
            </div>

        </div>

        `;

    });

    result.innerHTML = resultHTML;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

renderQuestions();
renderPalette();
startTimer();

</script>
