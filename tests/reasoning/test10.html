/* =========================
   VARIABLES
========================= */

let currentQuestion = 0;
let answers = new Array(questions.length).fill(null);
let submitted = false;

let timeLeft = 30 * 60;
let timerInterval;


/* =========================
   LOAD TEST
========================= */

function loadQuestion(){

    if(submitted) return;

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").innerText =
        "Question " + (currentQuestion + 1) +
        " of " + questions.length;

    document.getElementById("questionText").innerText = q.q;

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    q.o.forEach((option,index)=>{

        const label = document.createElement("label");

        label.className = "option";

        if(answers[currentQuestion] === index){
            label.classList.add("selected");
        }

        label.innerHTML =
            `<input type="radio"
             name="answer"
             value="${index}"
             ${answers[currentQuestion] === index ? "checked" : ""}>
             ${String.fromCharCode(65 + index)}. ${option}`;

        label.addEventListener("click",function(){

            answers[currentQuestion] = index;

            document.querySelectorAll(".option")
            .forEach(x => x.classList.remove("selected"));

            label.classList.add("selected");

            updateQuestionGrid();

        });

        optionsContainer.appendChild(label);

    });

    updateQuestionGrid();
}


/* =========================
   QUESTION GRID
========================= */

function createQuestionGrid(){

    const grid =
        document.getElementById("questionGrid");

    grid.innerHTML = "";

    questions.forEach((q,index)=>{

        const button =
            document.createElement("button");

        button.className = "q-number";

        button.innerText = index + 1;

        button.onclick = function(){

            if(!submitted){

                currentQuestion = index;
                loadQuestion();

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            }

        };

        grid.appendChild(button);

    });

    updateQuestionGrid();
}


function updateQuestionGrid(){

    const buttons =
        document.querySelectorAll(".q-number");

    buttons.forEach((button,index)=>{

        button.classList.remove("attempted");
        button.classList.remove("current");

        if(answers[index] !== null){
            button.classList.add("attempted");
        }

        if(index === currentQuestion){
            button.classList.add("current");
        }

    });

}


/* =========================
   NAVIGATION
========================= */

function nextQuestion(){

    if(currentQuestion < questions.length - 1){

        currentQuestion++;

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        loadQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =========================
   TIMER
========================= */

function startTimer(){

    timerInterval =
        setInterval(function(){

            if(timeLeft <= 0){

                clearInterval(timerInterval);

                submitTest(true);

                return;
            }

            timeLeft--;

            let minutes =
                Math.floor(timeLeft / 60);

            let seconds =
                timeLeft % 60;

            document.getElementById("timer")
            .innerText =
                String(minutes).padStart(2,"0")
                + ":" +
                String(seconds).padStart(2,"0");

            if(timeLeft <= 300){

                document.getElementById("timer")
                .style.background = "#fee2e2";

            }

        },1000);

}


/* =========================
   SUBMIT TEST
========================= */

function submitTest(autoSubmit){

    if(submitted) return;

    if(!autoSubmit){

        const confirmSubmit =
            confirm(
                "Are you sure you want to submit the test?"
            );

        if(!confirmSubmit){
            return;
        }

    }

    submitted = true;

    clearInterval(timerInterval);

    calculateResult();

}


/* =========================
   RESULT
========================= */

function calculateResult(){

    let correct = 0;
    let wrong = 0;
    let unattempted = 0;

    questions.forEach((q,index)=>{

        if(answers[index] === null){

            unattempted++;

        }
        else if(answers[index] === q.a){

            correct++;

        }
        else{

            wrong++;

        }

    });


    const score =
        correct - (wrong * 0.33);

    const percentage =
        (score / questions.length) * 100;


    document.getElementById("correctCount")
        .innerText = correct;

    document.getElementById("wrongCount")
        .innerText = wrong;

    document.getElementById("unattemptedCount")
        .innerText = unattempted;

    document.getElementById("finalScore")
        .innerText = score.toFixed(2);

    document.getElementById("percentage")
        .innerText =
        Math.max(0,percentage).toFixed(2) + "%";


    showReview();


    document.getElementById("testContainer")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   REVIEW
========================= */

function showReview(){

    const container =
        document.getElementById("reviewContainer");

    container.innerHTML = "";

    questions.forEach((q,index)=>{

        if(
            answers[index] !== q.a
            ||
            answers[index] === null
        ){

            const div =
                document.createElement("div");

            if(answers[index] === null){

                div.className =
                    "review-item not-attempted";

            }
            else{

                div.className =
                    "review-item";

            }


            let selectedText =
                answers[index] === null
                ? "Not Attempted"
                : q.o[answers[index]];


            div.innerHTML = `

                <h4>
                    Q${index + 1}. ${q.q}
                </h4>

                <p>
                    <strong>Your Answer:</strong>
                    ${selectedText}
                </p>

                <p class="correct-answer">
                    Correct Answer:
                    ${q.o[q.a]}
                </p>

                <p class="explanation">
                    <strong>Solution:</strong>
                    ${q.e}
                </p>

            `;

            container.appendChild(div);

        }

    });


    if(container.innerHTML === ""){

        container.innerHTML = `
            <div class="review-item"
                 style="border-left-color:#16a34a;
                        background:#f0fdf4;">
                <h3>🎉 Excellent!</h3>
                <p>
                    All questions were answered correctly.
                </p>
            </div>
        `;

    }

}


/* =========================
   START
========================= */

createQuestionGrid();

loadQuestion();

startTimer();

</script>
