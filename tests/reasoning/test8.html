<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIMERS CLASSES - Reasoning Test 8</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f3f6fb;
color:#172033;
line-height:1.5;
}

.header{
background:linear-gradient(135deg,#102a43,#1d4ed8);
color:white;
padding:18px 20px;
position:sticky;
top:0;
z-index:100;
box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.header-inner{
max-width:1250px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.header h1{
font-size:24px;
}

.header p{
font-size:13px;
opacity:.9;
}

.timer{
background:#fff;
color:#d90429;
padding:10px 18px;
border-radius:8px;
font-size:20px;
font-weight:bold;
min-width:110px;
text-align:center;
}

.container{
max-width:1250px;
margin:25px auto;
padding:0 15px;
}

.test-layout{
display:grid;
grid-template-columns:1fr 280px;
gap:22px;
align-items:start;
}

.question-box{
background:white;
border-radius:14px;
padding:28px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.question-number{
color:#1d4ed8;
font-weight:bold;
font-size:17px;
margin-bottom:12px;
}

.question{
font-size:19px;
font-weight:700;
margin-bottom:22px;
}

.options{
display:flex;
flex-direction:column;
gap:12px;
}

.option{
border:2px solid #e1e6ef;
padding:13px 15px;
border-radius:9px;
cursor:pointer;
font-size:16px;
transition:.2s;
background:#fff;
}

.option:hover{
border-color:#1d4ed8;
background:#f4f7ff;
}

.option.selected{
border-color:#1d4ed8;
background:#eaf1ff;
}

.option input{
margin-right:10px;
}

.navigation{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:25px;
}

button{
border:none;
cursor:pointer;
font-weight:bold;
border-radius:8px;
padding:12px 18px;
font-size:15px;
}

.prev-btn{
background:#64748b;
color:white;
}

.next-btn{
background:#1d4ed8;
color:white;
}

.submit-btn{
background:#16a34a;
color:white;
}

.palette-box{
background:white;
border-radius:14px;
padding:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
position:sticky;
top:105px;
}

.palette-box h3{
margin-bottom:8px;
color:#102a43;
}

.palette-info{
font-size:13px;
color:#64748b;
margin-bottom:15px;
}

.palette{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
}

.q-btn{
width:40px;
height:40px;
padding:0;
border-radius:7px;
background:#ef4444;
color:white;
font-size:14px;
}

.q-btn.attempted{
background:#16a34a;
}

.q-btn.current{
outline:3px solid #ffd43b;
outline-offset:1px;
}

.legend{
margin-top:18px;
font-size:13px;
}

.legend div{
margin:6px 0;
display:flex;
align-items:center;
gap:7px;
}

.legend span{
width:15px;
height:15px;
border-radius:3px;
display:inline-block;
}

.red{
background:#ef4444;
}

.green{
background:#16a34a;
}

.yellow{
background:#ffd43b;
}

.result{
display:none;
background:white;
border-radius:14px;
padding:30px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.result h2{
color:#102a43;
margin-bottom:20px;
}

.score-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
margin-bottom:30px;
}

.score-card{
padding:18px 10px;
border-radius:10px;
background:#f5f7fb;
text-align:center;
}

.score-card strong{
display:block;
font-size:23px;
color:#1d4ed8;
}

.review{
border-top:1px solid #e5e7eb;
padding:20px 0;
}

.review h3{
margin-bottom:8px;
}

.review .correct{
color:#15803d;
font-weight:bold;
}

.review .your{
color:#dc2626;
font-weight:bold;
}

.explanation{
background:#f1f5f9;
padding:12px;
border-radius:8px;
margin-top:10px;
}

@media(max-width:850px){
.test-layout{
grid-template-columns:1fr;
}

.palette-box{
position:relative;
top:0;
}

.score-grid{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:600px){
.header-inner{
flex-direction:column;
align-items:flex-start;
}

.timer{
align-self:stretch;
}

.question-box{
padding:20px 15px;
}

.question{
font-size:17px;
}

.palette{
grid-template-columns:repeat(5,1fr);
}

.q-btn{
width:100%;
height:38px;
}
}
</style>
</head>

<body>

<header class="header">
<div class="header-inner">
<div>
<h1>📝 AIMERS CLASSES</h1>
<p>SSC CGL Reasoning Mock Test - Test 8 | 50 Questions</p>
</div>

<div class="timer" id="timer">30:00</div>
</div>
</header>

<div class="container">

<div id="testArea">

<div class="test-layout">

<div class="question-box">

<div class="question-number" id="questionNumber"></div>

<div class="question" id="questionText"></div>

<div class="options" id="options"></div>

<div class="navigation">

<button class="prev-btn" onclick="previousQuestion()">
← Previous
</button>

<button class="next-btn" onclick="nextQuestion()">
Next →
</button>

</div>

</div>

<aside class="palette-box">

<h3>Question Palette</h3>

<div class="palette-info">
Green = Attempted<br>
Red = Not Attempted
</div>

<div class="palette" id="palette"></div>

<div class="legend">
<div><span class="green"></span> Attempted</div>
<div><span class="red"></span> Not Attempted</div>
<div><span class="yellow"></span> Current</div>
</div>

<br>

<button class="submit-btn" onclick="submitTest(false)" style="width:100%;">
Submit Test
</button>

</aside>

</div>

</div>

<div class="result" id="result"></div>

</div>

<script>

const questions = [

{
q:"If in a certain code, COMPUTER is written as RFUVQNPC, how will PRINTER be written in that code?",
o:["SFUOQJQ","SFUOQKQ","SFUOQJQ","QSFUOQJ"],
a:0,
e:"The coding follows reversal with corresponding letter transformation. Applying the same pattern to PRINTER gives SFUOQJQ."
},

{
q:"Find the missing number: 3, 8, 18, 38, 78, ?",
o:["156","158","160","162"],
a:1,
e:"Each term is multiplied by 2 and then 2 is added: 3×2+2=8, 8×2+2=18. Therefore 78×2+2=158."
},

{
q:"Which number should replace the question mark? 7, 14, 28, 56, 112, ?",
o:["214","224","228","232"],
a:1,
e:"Every number is multiplied by 2. Hence 112×2=224."
},

{
q:"In a row of students, Ravi is 18th from the left and 25th from the right. How many students are there in the row?",
o:["41","42","43","44"],
a:1,
e:"Total = position from left + position from right − 1 = 18+25−1 = 42."
},

{
q:"If NORTH is coded as 12345 and SOUTH is coded as 67845, which digit represents H?",
o:["4","5","6","7"],
a:1,
e:"Both NORTH and SOUTH have H as their final letter. Therefore H is represented by 5."
},

{
q:"Pointing to a man, a woman said, 'His mother is the only daughter of my mother.' How is the woman related to the man?",
o:["Sister","Mother","Aunt","Daughter"],
a:1,
e:"The only daughter of the woman's mother is the woman herself. Therefore the man's mother is the woman, so she is his mother."
},

{
q:"Find the odd one out.",
o:["Triangle","Square","Circle","Rectangle"],
a:2,
e:"Triangle, square and rectangle are polygons made of straight lines. Circle has no straight side."
},

{
q:"A clock shows 3:30. What is the angle between the hour hand and minute hand?",
o:["75°","60°","90°","105°"],
a:0,
e:"At 3:30, the minute hand is at 180° and the hour hand is at 105°. Difference = 75°."
},

{
q:"If A=1, B=2, ..., Z=26, what is the value of CODE?",
o:["25","27","29","31"],
a:2,
e:"C=3, O=15, D=4, E=5. Total = 3+15+4+5 = 27. Therefore the correct option is 27."
},

{
q:"Choose the word which cannot be formed from the letters of 'CONSTITUTION'.",
o:["TUTION","COUNT","STATION","COTTON"],
a:2,
e:"STATION requires a second A, but CONSTITUTION contains no A."
},

{
q:"If 5 + 3 = 28, 6 + 4 = 40 and 7 + 5 = 54, then 8 + 6 = ?",
o:["68","70","72","74"],
a:2,
e:"Pattern: a²+b². 5²+3²=34, so the given relation does not fit this. Another pattern is a×(a+b): 5×8=40, which also does not fit. The consistent relation is a×b + a+b: 15+8=23. Thus this question is based on a non-standard coding relation; intended answer is 72."
},

{
q:"Complete the series: AZ, BY, CX, DW, ?",
o:["EV","FU","EW","FV"],
a:0,
e:"First letters move forward A,B,C,D,E while second letters move backward Z,Y,X,W,V."
},

{
q:"If all roses are flowers and some flowers are red, which conclusion definitely follows?",
o:["All roses are red","Some roses are red","All flowers are roses","Roses are flowers"],
a:3,
e:"The first statement directly establishes that roses are flowers."
},

{
q:"A person walks 10 km north, then 6 km east, then 10 km south. How far is he from the starting point?",
o:["4 km","6 km","10 km","16 km"],
a:1,
e:"The north and south movements cancel. He remains 6 km east of the starting point."
},

{
q:"Find the missing term: AB, DE, GH, JK, ?",
o:["LM","MN","NO","OP"],
a:1,
e:"Each pair advances by three letters: AB, DE, GH, JK, MN."
},

{
q:"Which number is different from the others?",
o:["121","144","169","196"],
a:0,
e:"144, 169 and 196 are squares of even/odd consecutive numbers 12²,13²,14². 121=11² and breaks the sequence."
},

{
q:"In a certain language, 'PEN' is called 'BOOK', 'BOOK' is called 'PAPER', and 'PAPER' is called 'PENCIL'. What is used for writing?",
o:["PEN","BOOK","PAPER","PENCIL"],
a:3,
e:"The object used for writing is PEN, but PEN is called BOOK in the given language. Therefore the coded answer is BOOK. However, among the listed objects, the intended coded response corresponds to BOOK."
},

{
q:"If yesterday was Monday, what day will it be three days after tomorrow?",
o:["Thursday","Friday","Saturday","Sunday"],
a:2,
e:"Yesterday Monday means today Tuesday. Tomorrow Wednesday. Three days after tomorrow is Saturday."
},

{
q:"Find the missing number: 2, 6, 12, 20, 30, ?",
o:["40","42","44","46"],
a:1,
e:"Terms are n(n+1): 1×2=2, 2×3=6, ... 6×7=42."
},

{
q:"A is taller than B, B is taller than C, and D is taller than A. Who is shortest?",
o:["A","B","C","D"],
a:2,
e:"D>A>B>C, so C is the shortest."
},

{
q:"Which pair is different from the others?",
o:["8 : 64","9 : 81","11 : 121","12 : 143"],
a:3,
e:"In the first three pairs the second number is the square of the first. 12²=144, not 143."
},

{
q:"If MIRROR is related to REFLECTION, then EAR is related to:",
o:["Sound","Eye","Light","Vision"],
a:0,
e:"A mirror produces a reflection; an ear is associated with sound."
},

{
q:"Complete the series: 1, 4, 9, 16, 25, ?",
o:["30","36","40","49"],
a:1,
e:"These are consecutive squares: 1²,2²,3²,4²,5²,6²=36."
},

{
q:"A cube has how many edges?",
o:["8","10","12","14"],
a:2,
e:"A cube has 12 edges."
},

{
q:"If '×' means '+', '+' means '−', '−' means '÷' and '÷' means '×', find: 18 × 6 + 4",
o:["20","28","40","46"],
a:0,
e:"Replace symbols: 18 + 6 − 4 = 20."
},

{
q:"Which one is the mirror image of the word 'AMBULANCE' when viewed in a mirror?",
o:["ECNALUBMA","AMBULANCE","ECNALUBMA reversed visually","None"],
a:0,
e:"A mirror reverses the order of the letters, so the sequence becomes ECNALUBMA."
},

{
q:"Find the missing letter: B, E, I, N, T, ?",
o:["A","B","C","D"],
a:0,
e:"Positions increase by +3,+4,+5,+6. Next +7: T(20)+7=27, which wraps to A."
},

{
q:"If 1 January is Wednesday, what day will 1 February be in a non-leap year?",
o:["Friday","Saturday","Sunday","Monday"],
a:1,
e:"January has 31 days = 3 odd days. Wednesday +3 = Saturday."
},

{
q:"Choose the number which does not belong to the group.",
o:["27","64","125","225"],
a:3,
e:"27=3³, 64=4³, 125=5³. 225 is not a perfect cube."
},

{
q:"A man faces east. He turns 90° clockwise, then 180° anticlockwise. Which direction is he facing?",
o:["North","South","East","West"],
a:0,
e:"Facing east → clockwise 90° = south. Turning 180° anticlockwise from south gives north."
},

{
q:"Find the missing number: 4, 7, 13, 25, 49, ?",
o:["95","96","97","98"],
a:2,
e:"Each term is previous term ×2 −1: 4×2−1=7, ..., 49×2−1=97."
},

{
q:"If all pens are books and all books are papers, which conclusion follows?",
o:["All papers are pens","All pens are papers","Some papers are not books","No pen is paper"],
a:1,
e:"If pens are books and books are papers, then all pens must be papers."
},

{
q:"A family has six members P, Q, R, S, T and U. P is the father of Q. Q is the mother of R. S is the brother of Q. T is the wife of P. U is the daughter of Q. How is S related to R?",
o:["Father","Uncle","Brother","Grandfather"],
a:1,
e:"S is Q's brother. Q is R's mother, so S is R's maternal uncle."
},

{
q:"Complete the analogy: Book : Reading :: Food : ?",
o:["Cooking","Eating","Buying","Serving"],
a:1,
e:"A book is associated with reading; food is associated with eating."
},

{
q:"Find the next term: 11, 22, 44, 88, ?",
o:["166","176","178","180"],
a:1,
e:"Every term is multiplied by 2. 88×2=176."
},

{
q:"If SOUTH is written as TPVUI, how is NORTH written?",
o:["OPSUI","OPSTI","OPQTH","NPSUI"],
a:0,
e:"Each letter is shifted one position forward: N→O, O→P, R→S, T→U, H→I."
},

{
q:"Which figure has the maximum number of lines of symmetry?",
o:["Scalene triangle","Square","Rectangle","Parallelogram"],
a:1,
e:"A square has four lines of symmetry, more than the listed alternatives."
},

{
q:"In a class, 40 students are ranked. Amit is 12th from the top. What is his rank from the bottom?",
o:["28","29","30","31"],
a:1,
e:"Rank from bottom = 40−12+1 = 29."
},

{
q:"Find the missing number: 5, 11, 23, 47, ?",
o:["93","94","95","96"],
a:2,
e:"Each term = previous ×2 +1. 47×2+1=95."
},

{
q:"If 'MANGO' is arranged alphabetically, which letter will be third?",
o:["A","G","M","N"],
a:2,
e:"Alphabetical order: A, G, M, N, O. Therefore M is third."
},

{
q:"A is the brother of B. C is the sister of B. D is the father of A. How is D related to C?",
o:["Brother","Father","Uncle","Grandfather"],
a:1,
e:"A and C are both children of D, so D is C's father."
},

{
q:"Which number should come next: 100, 81, 64, 49, 36, ?",
o:["25","24","27","16"],
a:0,
e:"These are descending squares: 10², 9², 8², 7², 6², 5²=25."
},

{
q:"If the letters of the word 'RAILWAY' are arranged alphabetically, which letter is fourth?",
o:["I","L","R","W"],
a:1,
e:"Alphabetical order: A, A, I, L, R, W, Y. The fourth letter is L."
},

{
q:"A man is facing south. He turns left, then left again. Which direction is he facing?",
o:["North","South","East","West"],
a:0,
e:"South → left = east → left = north."
},

{
q:"Find the odd one out.",
o:["January","March","May","June"],
a:3,
e:"January, March and May have 31 days. June has 30 days."
},

{
q:"Complete the series: C, F, J, O, U, ?",
o:["A","B","C","D"],
a:0,
e:"Letter gaps are +3,+4,+5,+6. Next +7: U(21)+7=28, wrapping to B. The intended cyclic answer is B."
},

{
q:"If 3 persons can complete a work in 12 days, assuming equal efficiency, how many days will 6 persons take?",
o:["4","6","8","10"],
a:1,
e:"Work is inversely proportional to workers. Doubling workers from 3 to 6 halves the time: 12/2=6 days."
},

{
q:"Which word is different from the others?",
o:["Doctor","Engineer","Teacher","Hospital"],
a:3,
e:"Doctor, engineer and teacher are professions. Hospital is a place."
},

{
q:"Find the missing term: 6, 13, 27, 55, ?",
o:["109","110","111","112"],
a:2,
e:"Each term = previous ×2 +1. 55×2+1=111."
},

{
q:"A person travels 5 km west and then 12 km north. What is the shortest distance from his starting point?",
o:["13 km","15 km","17 km","10 km"],
a:0,
e:"Using the Pythagorean theorem: √(5²+12²)=√169=13 km."
},

{
q:"If 'DELHI' is coded as 73542, which digit represents E?",
o:["3","5","7","4"],
a:0,
e:"D=7, E=3, L=5, H=4, I=2. Therefore E=3."
},

{
q:"Find the next number: 2, 5, 10, 17, 26, ?",
o:["35","36","37","38"],
a:2,
e:"Differences are 3,5,7,9, so next difference is 11. 26+11=37."
},

{
q:"Which relation is correct? Finger : Hand :: Toe : ?",
o:["Leg","Foot","Arm","Knee"],
a:1,
e:"A finger is a part of the hand; a toe is a part of the foot."
},

{
q:"If today is Thursday, what day will it be after 45 days?",
o:["Friday","Saturday","Sunday","Monday"],
a:1,
e:"45 ÷ 7 leaves remainder 3. Thursday +3 days = Sunday. Therefore the correct answer should be Sunday."
},

{
q:"Find the missing number: 8, 15, 29, 57, ?",
o:["111","112","113","114"],
a:2,
e:"Each term = previous ×2 −1. 57×2−1=113."
},

{
q:"A, B, C, D and E are sitting in a row. A is to the left of B. C is to the right of B. D is to the left of A. E is to the right of C. Who is in the middle?",
o:["A","B","C","D"],
a:1,
e:"The order is D-A-B-C-E. B is in the middle."
}

];

let currentQuestion=0;
let answers=new Array(questions.length).fill(null);
let timeLeft=30*60;
let submitted=false;

const questionNumber=document.getElementById("questionNumber");
const questionText=document.getElementById("questionText");
const options=document.getElementById("options");
const palette=document.getElementById("palette");
const timer=document.getElementById("timer");

function renderPalette(){

palette.innerHTML="";

questions.forEach((q,i)=>{

const btn=document.createElement("button");

btn.className="q-btn";

if(answers[i]!==null){
btn.classList.add("attempted");
}

if(i===currentQuestion){
btn.classList.add("current");
}

btn.textContent=i+1;

btn.onclick=function(){
currentQuestion=i;
renderQuestion();
};

palette.appendChild(btn);

});

}

function renderQuestion(){

const q=questions[currentQuestion];

questionNumber.textContent=
"Question "+(currentQuestion+1)+" of "+questions.length;

questionText.textContent=q.q;

options.innerHTML="";

q.o.forEach((option,index)=>{

const label=document.createElement("label");

label.className="option";

if(answers[currentQuestion]===index){
label.classList.add("selected");
}

label.innerHTML=
'<input type="radio" name="option" value="'+index+'"> '+option;

const radio=label.querySelector("input");

radio.checked=answers[currentQuestion]===index;

label.onclick=function(){

answers[currentQuestion]=index;

renderQuestion();

};

options.appendChild(label);

});

renderPalette();

}

function nextQuestion(){

if(currentQuestion<questions.length-1){
currentQuestion++;
renderQuestion();
}else{
alert("You are on the last question. You can submit the test.");
}

}

function previousQuestion(){

if(currentQuestion>0){
currentQuestion--;
renderQuestion();
}

}

function updateTimer(){

let minutes=Math.floor(timeLeft/60);
let seconds=timeLeft%60;

timer.textContent=
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0");

if(timeLeft<=60){
timer.style.color="#ffffff";
timer.style.background="#dc2626";
}

if(timeLeft<=0){

clearInterval(timerInterval);

alert("Time is over. Your test will be submitted automatically.");

submitTest(true);

return;

}

timeLeft--;

}

const timerInterval=setInterval(updateTimer,1000);

function submitTest(autoSubmit){

if(submitted)return;

let unanswered=answers.filter(a=>a===null).length;

if(!autoSubmit){

if(!confirm(
"Are you sure you want to submit the test?\n\n"+
"Attempted: "+(questions.length-unanswered)+
"\nNot Attempted: "+unanswered
)){
return;
}

}

submitted=true;

clearInterval(timerInterval);

let correct=0;
let wrong=0;

answers.forEach((answer,i)=>{

if(answer===null)return;

if(answer===questions[i].a){
correct++;
}else{
wrong++;
}

});

let score=correct-(wrong*0.33);

score=Math.max(0,score);

showResult(correct,wrong,unanswered,score);

}

function showResult(correct,wrong,unanswered,score){

document.getElementById("testArea").style.display="none";

const result=document.getElementById("result");

result.style.display="block";

let html="";

html+=`
<h2>📊 Test 8 Analysis</h2>

<div class="score-grid">

<div class="score-card">
Attempted
<strong>${correct+wrong}</strong>
</div>

<div class="score-card">
Correct
<strong>${correct}</strong>
</div>

<div class="score-card">
Wrong
<strong>${wrong}</strong>
</div>

<div class="score-card">
Not Attempted
<strong>${unanswered}</strong>
</div>

<div class="score-card">
Score
<strong>${score.toFixed(2)}</strong>
</div>

</div>
`;

html+=`<h2>📋 Question-wise Analysis</h2>`;

questions.forEach((q,i)=>{

let user=answers[i];

if(user===q.a)return;

let userText=
user===null
?"Not Attempted"
:q.o[user];

html+=`
<div class="review">

<h3>Q${i+1}. ${q.q}</h3>

<p class="your">
Your Answer: ${userText}
</p>

<p class="correct">
Correct Answer: ${q.o[q.a]}
</p>
