<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fb;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#102a43,#1d4ed8);

    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
}

header h1{
    font-size:24px;
}

header p{
    margin-top:5px;
    font-size:14px;
}

.timer{

    background:#fff;
    color:#d90429;

    font-weight:bold;

.main{

    margin:20px auto;

.question-box{

    border-radius:12px;

}

.question{

}

.question.active{

}

.question-number{

    font-weight:bold;

}

.question-text{

    font-weight:700;
    line-height:1.6;
    margin-bottom:20px;
}

.option{
    display:block;
    padding:13px 15px;
    margin:10px 0;
    border:1px solid #d9dee8;

}

.option:hover{

}

.option input{

.navigation{

.btn{

    padding:11px 20px;
    border-radius:7px;

}

.prev-btn{
    background:#64748b;
    color:white;
}

.next-btn{
    background:#1d4ed8;
    color:white;
}

.submit-btn{
    background:#16a34a;
    color:white;
}

.palette{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    height:max-content;
    position:sticky;
    top:125px;
}

.palette h3{
    margin-bottom:15px;
    color:#102a43;
}

.question-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.q-number{
    width:40px;
    height:40px;
    border:none;
    border-radius:6px;
    background:#dc2626;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.q-number.attempted{
    background:#16a34a;
}

.q-number.current{
    outline:3px solid #ffd43b;
}

.legend{
    margin-top:18px;
    font-size:13px;
}

.legend span{
    display:block;
    margin:7px 0;
}

.dot{
    display:inline-block;
    width:13px;
    height:13px;
    border-radius:3px;
    margin-right:6px;
}

.red{
    background:#dc2626;
}

.green{
    background:#16a34a;
}

.result{
    display:none;
    background:white;
    max-width:1000px;
    margin:30px auto;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.1);
}

.result h2{
    color:#1d4ed8;
    margin-bottom:20px;
}

.score-box{

    grid-template-columns:repeat(4,1fr);

    margin-bottom:30px;
}

.score-card{
    padding:18px;
    border-radius:8px;
    background:#f1f5f9;
    text-align:center;
}

.score-card strong{
    display:block;
    font-size:25px;
    margin-top:5px;
}

.review{
    border-top:1px solid #ddd;
    padding:20px 0;
}

.review.correct{
    border-left:5px solid #16a34a;
    padding-left:15px;
}

.review.wrong{

    padding-left:15px;
}

.review.not-attempted{
    border-left:5px solid #f59e0b;
    padding-left:15px;
}

.review h3{
    margin-bottom:10px;
}

.answer{
    margin:7px 0;
}

.explanation{
    margin-top:10px;
    background:#f8fafc;
    padding:12px;
    border-radius:7px;

@media(max-width:800px){
    .main{
        grid-template-columns:1fr;

    .palette{
        position:relative;

let currentQuestion = 0;
let submitted = false;
let timeLeft = 30 * 60;
let timerInterval;

const answers = new Array(questions.length).fill(null);

function loadQuestions(){

    const container = document.getElementById("questions");
    const grid = document.getElementById("questionGrid");

    questions.forEach((item,index)=>{

        const div = document.createElement("div");
        div.className = "question";
        div.id = "question-" + index;

        let html = `
            <div class="question-number">
                Question ${index+1} of ${questions.length}
            </div>

            <div class="question-text">
                ${item.q}
            </div>
        `;

        item.o.forEach((option,optIndex)=>{

            html += `
                <label class="option">
                    <input
                        type="radio"
                        name="q${index}"
                        value="${optIndex}"
                        onchange="selectAnswer(${index},${optIndex})">
                    ${String.fromCharCode(65+optIndex)}. ${option}
                </label>
            `;

        });

        div.innerHTML = html;
        container.appendChild(div);

        const button = document.createElement("button");

        button.className = "q-number";
        button.id = "palette-" + index;
        button.textContent = index + 1;

        button.onclick = function(){
            showQuestion(index);
        };

        grid.appendChild(button);

    });

    showQuestion(0);
}

function showQuestion(index){

    if(submitted) return;

    if(index < 0) index = 0;
    if(index >= questions.length) index = questions.length-1;

    currentQuestion = index;

    document.querySelectorAll(".question").forEach(q=>{
        q.classList.remove("active");
    });

    document.getElementById("question-"+index)
        .classList.add("active");

    document.querySelectorAll(".q-number").forEach((btn,i)=>{

        btn.classList.toggle(
            "attempted",
            answers[i] !== null
        );

        btn.classList.toggle(
            "current",
            i === index
        );

    });

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function selectAnswer(questionIndex,optionIndex){

    answers[questionIndex] = optionIndex;

    const button =
        document.getElementById(
            "palette-"+questionIndex
        );

    button.classList.add("attempted");
}

function nextQuestion(){

    if(currentQuestion < questions.length-1){
        showQuestion(currentQuestion+1);
    }

}

function previousQuestion(){

    if(currentQuestion > 0){
        showQuestion(currentQuestion-1);
    }

}

function updateTimer(){

    let minutes =
        Math.floor(timeLeft/60);

    let seconds =
        timeLeft%60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2,"0")
        + ":" +
        String(seconds).padStart(2,"0");

    if(timeLeft <= 60){
        document.getElementById("timer").style.background="#fee2e2";
        document.getElementById("timer").style.color="#dc2626";
    }

    if(timeLeft <= 0){

        clearInterval(timerInterval);

        alert(
            "⏰ Time is over! Your test will be submitted automatically."
        );

        submitTest();

        return;
    }

    timeLeft--;

}

function submitTest(){

    if(submitted) return;

    let unanswered =
        answers.filter(a=>a===null).length;

    if(timeLeft > 0){

        const confirmSubmit =
            confirm(
                "Are you sure you want to submit the test?\n\n"
                + "Not Attempted: "
                + unanswered
            );

        if(!confirmSubmit) return;

    }

    submitted = true;

    clearInterval(timerInterval);

    calculateResult();

    document.querySelector(".main").style.display="none";

    document.querySelector("header").style.position="relative";

    document.getElementById("result").style.display="block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function calculateResult(){

    let correct = 0;
    let wrong = 0;
    let notAttempted = 0;

    questions.forEach((question,index)=>{

        if(answers[index] === null){

            notAttempted++;

        }
        else if(answers[index] === question.a){

            correct++;

        }
        else{

            wrong++;

        }

    });

    const score =
        correct -
        (wrong * 0.33);

    document.getElementById("correctCount")
        .textContent = correct;

    document.getElementById("wrongCount")
        .textContent = wrong;

    document.getElementById("notAttempted")
        .textContent = notAttempted;

    document.getElementById("finalScore")
        .textContent = score.toFixed(2);

    createReview();

}

function createReview(){

    const review =
        document.getElementById("review");

    review.innerHTML = "";

    questions.forEach((question,index)=>{

        let status;
        let statusClass;

        if(answers[index] === null){

            status = "Not Attempted";
            statusClass = "not-attempted";

        }
        else if(answers[index] === question.a){

            status = "Correct";
            statusClass = "correct";

        }
        else{

            status = "Wrong";
            statusClass = "wrong";

        }

        const div =
            document.createElement("div");

        div.className =
            "review " + statusClass;

        let selectedText =
            answers[index] === null
            ? "Not Attempted"
            : question.o[answers[index]];

        div.innerHTML = `

            <h3>
                Q${index+1}. ${status}
            </h3>

            <p>
                <strong>Question:</strong>
                ${question.q}
            </p>

            <p class="answer">
                <strong>Your Answer:</strong>
                ${selectedText}
            </p>

            <p class="answer">
                <strong>Correct Answer:</strong>
                ${question.o[question.a]}
            </p>

            <div class="explanation">
                <strong>💡 Solution:</strong><br>
                ${question.e}
            </div>
        `;

        review.appendChild(div);

    });

}
