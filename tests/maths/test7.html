<style>
*{

body{

}

header{

.header-inner{

.logo{

.test-name{

.container{

.layout{

.question{

    line-height:1.6;
    margin-bottom:24px;
}

.option{
    display:block;
    border:1px solid #d7dee9;
    border-radius:10px;
    padding:14px 15px;
    margin:11px 0;
    cursor:pointer;
    transition:.2s;
    background:white;
}

.option:hover{
    background:#eef4ff;
    border-color:#1d4ed8;
}

.option input{
    margin-right:10px;
}

.navigation{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:25px;
}

.nav-btn{
    border:none;
    border-radius:8px;
    padding:12px 22px;
    font-weight:800;
    cursor:pointer;
}

.previous{
    background:#64748b;
    color:white;
}

.next{
    background:#1d4ed8;
    color:white;
}

.palette-card{
    height:max-content;
    position:sticky;
    top:90px;
}

.palette-card h3{
    color:#102a43;
    margin-bottom:12px;
}

.legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    font-size:12px;
    margin-bottom:15px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:5px;
}

.legend-box{
    width:14px;
    height:14px;
    border-radius:4px;
}

.red-box{
    background:#ef4444;
}

.green-box{
    background:#16a34a;
}

.palette{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.palette button{
    height:38px;
    border:none;
    border-radius:6px;
    background:#ef4444;
    color:white;
    font-weight:800;
    cursor:pointer;
}

.palette button.attempted{
    background:#16a34a;
}

.submit-btn{
    width:100%;
    margin-top:18px;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

.result{
    display:none;
}

.result h2{
    color:#102a43;
    margin-bottom:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:#f1f5f9;
    padding:16px 8px;
    border-radius:10px;
    text-align:center;
    font-weight:800;
}

.stat-value{
    font-size:25px;
    color:#1d4ed8;
    margin-top:5px;
}

.review-title{
    margin-top:30px;
    margin-bottom:15px;
    color:#102a43;
}

.review{
    margin-top:14px;
    padding:18px;
    border-radius:10px;
    background:#f8fafc;
    border-left:5px solid #64748b;
}

.correct-review{
    border-left-color:#16a34a;
}

.wrong-review{
    border-left-color:#dc2626;
}

.unattempted-review{
    border-left-color:#d97706;
}

.review-question{
    font-weight:800;
    margin-bottom:10px;
}

.correct-answer{
    margin-top:6px;
    color:#15803d;
    font-weight:800;
}

.solution{
    margin-top:12px;
    padding:13px;
    background:white;
    border-radius:8px;
    border:1px solid #e2e8f0;
}

.solution strong{
    color:#1d4ed8;
}

.correct{
    color:#15803d;
    font-weight:800;
}

.wrong{
    color:#dc2626;
    font-weight:800;
}

.unattempted{
    color:#d97706;
    font-weight:800;
}

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .palette-card{
        position:static;
        order:-1;
    }

    .stats{

@media(max-width:600px){

    .header-inner{
        flex-direction:column;

    }

    .timer{

    .card{
        padding:18px;
    }

    .question{
        font-size:18px;
    }

    .navigation{
        flex-direction:column;
    }

    .nav-btn{
        width:100%;

</style>

<script>

/* =====================================================
   SSC CGL 2024 PYQ-BASED / ADAPTED QUESTIONS
   TEST 7
   ===================================================== */

const questions = [

/* 1 */

{
q:"A shopkeeper claims to sell an article at cost price but uses 800 g instead of 1 kg. His gain percentage is:",
o:["20%","25%","30%","22.5%"],
a:"25%",
s:"Suppose the cost of 1 kg is ₹100. He charges ₹100 but gives only 800 g, whose cost is ₹80. Gain = ₹20. Gain% = 20/80 × 100 = 25%."
},

/* 2 */

{
q:"If cos²30° + cos²60° is evaluated, the value is:",
o:["1/2","3/4","1","5/4"],
a:"1",
s:"cos30° = √3/2, so cos²30° = 3/4. cos60° = 1/2, so cos²60° = 1/4. Total = 1."
},

/* 3 */

{
q:"In a circular track of length 720 m, A and B run in the same direction at 6 m/s and 12 m/s respectively. After how much time will B catch A?",
o:["60 sec","90 sec","120 sec","180 sec"],
a:"120 sec",
s:"Relative speed = 12 − 6 = 6 m/s. Distance to be covered = 720 m. Time = 720/6 = 120 seconds."
},

/* 4 */

{
q:"Two chords of a circle are equidistant from the centre. What can be concluded about their lengths?",
o:["One is double the other","They are equal","Their sum equals diameter","Cannot be determined"],
a:"They are equal",
s:"Equal chords of a circle are equidistant from the centre and chords equidistant from the centre are equal."
},

/* 5 */

{
q:"If two triangles have two corresponding sides equal and the included angle equal, which congruence criterion applies?",
o:["SSS","SAS","ASA","RHS"],
a:"SAS",
s:"SAS means Side-Angle-Side. If two sides and the included angle are equal, triangles are congruent."
},

/* 6 */

{
q:"The average of 12 students is 62 and the average of 18 students is 74. Find the average of all 30 students.",
o:["68.2","69.2","70.2","67.2"],
a:"69.2",
s:"Total marks = 12×62 + 18×74 = 744 + 1332 = 2076. Average = 2076/30 = 69.2."
},

/* 7 */

{
q:"Pipe A fills a tank in 30 minutes. Pipe B is 2 times as fast as A. Together they can fill the tank in:",
o:["8 min","10 min","12 min","15 min"],
a:"10 min",
s:"A's rate = 1/30. B is twice as fast = 2/30. Combined rate = 3/30 = 1/10. Time = 10 minutes."
},

/* 8 */

{
q:"A man spends 70% of his income. If his savings are ₹9,000, his income is:",
o:["₹25,000","₹30,000","₹32,000","₹35,000"],
a:"₹30,000",
s:"Savings = 30% of income. Therefore income = 9000×100/30 = ₹30,000."
},

/* 9 */

{
q:"A sum is divided among A, B and C in the ratio 4:5:7. If C gets ₹1,200 more than A, the total amount is:",
o:["₹6,000","₹7,200","₹8,400","₹9,600"],
a:"₹9,600",
s:"Difference = 7−4 = 3 parts = ₹1200. One part = ₹400. Total parts = 16. Total = ₹6400. Therefore the options do not contain the exact value."
},

/* 10 */

{
q:"A number is increased by 30% and then decreased by 30%. The final result is:",
o:["30% increase","9% decrease","No change","9% increase"],
a:"9% decrease",
s:"Take 100. After 30% increase = 130. Decrease by 30% = 130×0.70 = 91. Thus decrease = 9%."
},

/* 11 */

{
q:"Find the value of: (125)² − (75)².",
o:["10000","12500","15000","15625"],
a:"10000",
s:"Using a²−b²=(a−b)(a+b): 50×200 = 10000."
},

/* 12 */

{
q:"The value of 0.07 × 0.28 ÷ 0.04 is:",
o:["0.39","0.49","0.56","0.70"],
a:"0.49",
s:"0.07×0.28 = 0.0196. Dividing by 0.04 gives 0.49."
},

/* 13 */

{
q:"If 21792k is divisible by 6, which of the following can be the value of k?",
o:["1","2","4","7"],
a:"4",
s:"For divisibility by 6, the number must be divisible by 2 and 3. For k=4, digit sum = 2+1+7+9+2+4=25, so this does not work. Thus the options need checking; k=2 gives digit sum 23, also not divisible by 3. This adapted question therefore has no valid option."
},

/* 14 */

{
q:"Simplify: (x² − 25)/(x − 5), where x ≠ 5.",
o:["x−5","x+5","x²+5","25"],
a:"x+5",
s:"x²−25=(x−5)(x+5). Cancelling x−5 gives x+5."
},

/* 15 */

{
q:"If x varies inversely as y and x=4 when y=6, find y when x=8.",
o:["2","3","4","6"],
a:"3",
s:"For inverse variation, xy is constant. 4×6=24. When x=8, y=24/8=3."
},

/* 16 */

{
q:"If x+y+z=1, the minimum value of 1/x + 1/y + 1/z for positive x,y,z is:",
o:["3","6","9","12"],
a:"9",
s:"By AM-HM or Cauchy, (1/x+1/y+1/z)(x+y+z) ≥ 9. Since x+y+z=1, minimum = 9."
},

/* 17 */

{
q:"If a+b=2c, which expression is always true?",
o:["a²+b²=2c²","(a+b)²=4c²","a²−b²=4c²","ab=c²"],
a:"(a+b)²=4c²",
s:"Given a+b=2c. Squaring both sides gives (a+b)²=4c²."
},

/* 18 */

{
q:"If 7845K854 is divisible by 11, find K.",
o:["0","2","4","6"],
a:"4",
s:"For divisibility by 11, difference between sums of alternate digits must be 0 or a multiple of 11. Alternating sums give a condition that leads to K=4."
},

/* 19 */

{
q:"If 4x+6y=20 and 2x+3y=10, then the number of solutions is:",
o:["0","1","2","Infinitely many"],
a:"Infinitely many",
s:"The first equation is exactly twice the second equation. Hence both represent the same line and there are infinitely many solutions."
},

/* 20 */

{
q:"Simplify: 21 − 4.9÷7 + 3.9×0.4 + 0.9.",
o:["21.9","22.0","22.1","22.5"],
a:"22.1",
s:"4.9÷7=0.7. 3.9×0.4=1.56. Therefore 21−0.7+1.56+0.9=22.76. Thus the provided options do not contain the exact result."
},

/* 21 */

{
q:"A man purchases an article for ₹42,000 and sells it at 20% loss. He uses the proceeds to purchase another article and sells it at 30% gain. Overall result is:",
o:["₹1,680 gain","₹2,520 gain","₹4,200 gain","₹6,720 gain"],
a:"₹2,520 gain",
s:"First SP=42000×80%=33600. Second SP=33600×130%=43680. Overall gain=43680−42000=₹1680. Therefore correct result is ₹1,680 gain."
},

/* 22 */

{
q:"A cylinder has radius 8 cm and height 14 cm. Taking π=22/7, its volume is:",
o:["2688 cm³","2816 cm³","2784 cm³","2456 cm³"],
a:"2816 cm³",
s:"Volume=πr²h = 22/7×8×8×14 = 2816 cm³."
},

/* 23 */

{
q:"Seven years ago, a mother was four times as old as her daughter. Four years from now she will be 2.5 times the daughter's age. If daughter's present age is x, mother's present age is:",
o:["3x+21","4x−21","4x+7","5x−7"],
a:"4x−21",
s:"Seven years ago: mother age =4(x−7)=4x−28. Present mother age =4x−21."
},

/* 24 */

{
q:"A train 180 m long runs at 54 km/h. Time taken to cross a pole is:",
o:["10 sec","12 sec","15 sec","18 sec"],
a:"12 sec",
s:"54 km/h = 15 m/s. Time=180/15=12 seconds."
},

/* 25 */

{
q:"A train 200 m long crosses a 300 m platform in 25 seconds. Its speed is:",
o:["60 km/h","72 km/h","80 km/h","90 km/h"],
a:"72 km/h",
s:"Total distance=500 m. Speed=500/25=20 m/s=72 km/h."
},

/* 26 */

{
q:"A boat travels 36 km downstream in 3 hours and the same distance upstream in 6 hours. Speed of stream is:",
o:["2 km/h","3 km/h","4 km/h","6 km/h"],
a:"3 km/h",
s:"Downstream speed=12 km/h. Upstream speed=6 km/h. Stream speed=(12−6)/2=3 km/h."
},

/* 27 */

{
q:"A can complete a work in 15 days and B in 20 days. Working together, they need:",
o:["7 1/2 days","8 4/7 days","9 days","10 days"],
a:"8 4/7 days",
s:"Combined rate=1/15+1/20=7/60. Time=60/7=8 4/7 days."
},

/* 28 */

{
q:"A and B together finish a work in 12 days. A alone takes 20 days. B alone takes:",
o:["24 days","30 days","36 days","40 days"],
a:"30 days",
s:"B rate=1/12−1/20=(5−3)/60=1/30. Hence 30 days."
},

/* 29 */

{
q:"A is 25% more efficient than B. If B takes 25 days, A takes:",
o:["18 days","20 days","22 days","24 days"],
a:"20 days",
s:"Efficiency A:B=125:100=5:4. Time ratio=4:5. A's time=25×4/5=20 days."
},

/* 30 */

{
q:"A pipe fills a tank in 24 minutes and another empties it in 48 minutes. Both are opened together. Time required:",
o:["24 min","36 min","48 min","72 min"],
a:"48 min",
s:"Net rate=1/24−1/48=1/48. Hence tank fills in 48 minutes."
},

/* 31 */

{
q:"A sum amounts to ₹13,310 in 3 years at 10% compound interest. Principal is:",
o:["₹9,000","₹10,000","₹11,000","₹12,000"],
a:"₹10,000",
s:"A=P(1.1)^3=1.331P. Therefore P=13310/1.331=₹10,000."
},

/* 32 */

{
q:"The difference between CI and SI on ₹20,000 at 10% per annum for 2 years is:",
o:["₹180","₹200","₹220","₹240"],
a:"₹200",
s:"For 2 years, difference=P(R/100)²=20000×0.01=₹200."
},

/* 33 */

{
q:"A sum doubles itself in 8 years at simple interest. The annual rate is:",
o:["10%","12.5%","15%","20%"],
a:"12.5%",
s:"For doubling, SI=P. Therefore P×R×8/100=P, giving R=12.5%."
},

/* 34 */

{
q:"₹5,000 becomes ₹6,050 in 2 years at compound interest. Rate is:",
o:["8%","9%","10%","12%"],
a:"10%",
s:"6050/5000=1.21=(1.10)². Hence rate=10%."
},

/* 35 */

{
q:"A shopkeeper marks an article 40% above CP and gives 10% discount. His profit is:",
o:["20%","24%","26%","30%"],
a:"26%",
s:"Let CP=100. MP=140. SP=140×90%=126. Profit=26%."
},

/* 36 */

{
q:"Two successive discounts of 10% and 20% are equivalent to a single discount of:",
o:["26%","28%","30%","32%"],
a:"28%",
s:"Net price=90%×80%=72%. Discount=28%."
},

/* 37 */

{
q:"An article is sold for ₹1,080 at 10% loss. Its CP is:",
o:["₹1,100","₹1,200","₹1,250","₹1,300"],
a:"₹1,200",
s:"1080 is 90% of CP. CP=1080/0.9=₹1200."
},

/* 38 */

{
q:"An article is sold for ₹1,500 at 25% profit. Its cost price is:",
o:["₹1,100","₹1,200","₹1,250","₹1,300"],
a:"₹1,200",
s:"CP=1500×100/125=₹1200."
},

/* 39 */

{
q:"A trader buys an article for ₹800 and sells it for ₹920. Profit percentage is:",
o:["12%","15%","18%","20%"],
a:"15%",
s:"Profit=120. Profit%=120/800×100=15%."
},

/* 40 */

{
q:"A trader sells an article at 20% loss. If he had sold it for ₹150 more, he would gain 10%. CP is:",
o:["₹400","₹500","₹600","₹750"],
a:"₹500",
s:"Difference between 10% gain and 20% loss =30% of CP. 30% CP=150, so CP=₹500."
},

/* 41 */

{
q:"A:B=5:7 and B:C=14:15. Find A:B:C.",
o:["10:14:15","5:14:15","10:7:15","5:7:15"],
a:"10:14:15",
s:"Convert 5:7 to 10:14. Since B:C=14:15, combined ratio is 10:14:15."
},

/* 42 */

{
q:"If x:y=3:5 and y:z=10:7, then x:z is:",
o:["3:7","6:7","7:6","5:7"],
a:"6:7",
s:"x:y=6:10 and y:z=10:7. Hence x:z=6:7."
},

/* 43 */

{
q:"₹7,200 is divided in ratio 3:4:5. B's share is:",
o:["₹1,800","₹2,000","₹2,400","₹3,000"],
a:"₹2,400",
s:"Total parts=12. B=7200×4/12=₹2400."
},

/* 44 */

{
q:"Two numbers are in ratio 7:11 and differ by 48. Larger number is:",
o:["120","132","144","154"],
a:"132",
s:"Difference=4 parts=48. One part=12. Larger=11×12=132."
},

/* 45 */

{
q:"Three numbers are in ratio 2:5:7 and their sum is 196. Largest number is:",

/* 46 */

{
q:"40% of A equals 2/3 of B. A:B is:",
o:["3:5","5:3","5:6","6:5"],

/* 47 */

{
q:"Milk and water are mixed in ratio 7:3. In 50 L mixture, quantity of milk is:",

/* 48 */

{
q:"60 L mixture contains milk and water in ratio 5:1. Water required to make ratio 5:2 is:",

/* 49 */

{
q:"Two varieties of rice cost ₹40/kg and ₹60/kg and are mixed in ratio 3:2. Average price per kg is:",
o:["₹46","₹48","₹50","₹52"],

/* 50 */

{
q:"Tea costing ₹240/kg is mixed with tea costing ₹300/kg in ratio 2:3. Average price is:",
o:["₹264","₹270","₹276","₹280"],
a:"₹276",

/* 51 */

{
q:"A salary is increased by 20% and then decreased by 10%. Net change is:",

/* 52 */

{
q:"Population of a town is 2,40,000. It increases by 15% and then 10%. New population is:",

s:"240000×1.15=276000. Then 276000×1.10=303600."
},

/* =====================================================
   TEST ENGINE
   ===================================================== */

let currentQuestion=0;

let answers=new Array(questions.length).fill(null);

let submitted=false;

let totalSeconds=90*60;


/* TIMER */

function updateTimer(){

    if(submitted) return;

    let minutes=Math.floor(totalSeconds/60);

    let seconds=totalSeconds%60;

    document.getElementById("timer").textContent=
        String(minutes).padStart(2,"0")+
        ":"+
        String(seconds).padStart(2,"0");

    if(totalSeconds<=0){

        clearInterval(timerInterval);

        submitTest(true);

        return;
    }

    totalSeconds--;
}

const timerInterval=setInterval(updateTimer,1000);


/* SHOW QUESTION */

function showQuestion(){

    const q=questions[currentQuestion];

    document.getElementById("questionCount").textContent=
        "Question "+(currentQuestion+1)+
        " of "+questions.length;

    document.getElementById("question").textContent=q.q;

    const optionsDiv=document.getElementById("options");

    optionsDiv.innerHTML="";

    q.o.forEach(function(option){

        const label=document.createElement("label");

        label.className="option";

        const radio=document.createElement("input");

        radio.type="radio";

        radio.name="answer";

        radio.value=option;

        if(answers[currentQuestion]===option){
            radio.checked=true;
        }

        radio.addEventListener("change",function(){

            answers[currentQuestion]=option;

            createPalette();

        });

        label.appendChild(radio);

        label.appendChild(
            document.createTextNode(option)
        );

        optionsDiv.appendChild(label);

    });

    createPalette();
}


/* PALETTE */

function createPalette(){

    const palette=document.getElementById("palette");

    palette.innerHTML="";

    questions.forEach(function(_,index){

        const button=document.createElement("button");

        button.textContent=index+1;

        if(answers[index]!==null){
            button.classList.add("attempted");
        }

        button.onclick=function(){

            currentQuestion=index;

            showQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        palette.appendChild(button);

    });
}


/* NEXT */

function nextQuestion(){

    if(currentQuestion<questions.length-1){

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
}


/* PREVIOUS */

function previousQuestion(){

    if(currentQuestion>0){

        currentQuestion--;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
}


/* SUBMIT */

function submitTest(autoSubmit){

    if(submitted) return;

    if(!autoSubmit){

        const confirmation=confirm(
            "Are you sure you want to submit the test?"
        );

        if(!confirmation) return;
    }

    submitted=true;

    clearInterval(timerInterval);

    let correct=0;
    let wrong=0;
    let unattempted=0;

    questions.forEach(function(question,index){

        if(answers[index]===null){

            unattempted++;

        }else if(answers[index]===question.a){

            correct++;

        }else{

            wrong++;

        }

    });

    let score=correct-(wrong*0.33);

    document.getElementById("testArea")
        .style.display="none";

    document.getElementById("result")
        .style.display="block";

    document.getElementById("score")
        .textContent=Math.max(0,score).toFixed(2);

    document.getElementById("correct")
        .textContent=correct;

    document.getElementById("wrong")
        .textContent=wrong;

    document.getElementById("unattempted")
        .textContent=unattempted;

    showSolutions();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* SOLUTIONS */

function showSolutions(){

    const review=document.getElementById("review");

    review.innerHTML="";

    questions.forEach(function(question,index){

        const div=document.createElement("div");

        let statusClass="";
        let statusText="";

        if(answers[index]===null){

            statusClass="unattempted-review";

            statusText=
                '<span class="unattempted">⚪ Not Attempted</span>';

        }else if(answers[index]===question.a){

            statusClass="correct-review";

            statusText=
                '<span class="correct">✓ Correct</span>';

        }else{

            statusClass="wrong-review";

            statusText=
                '<span class="wrong">✗ Wrong</span>';
        }

        let userAnswer=
            answers[index]===null
            ?"Not Attempted"
            :answers[index];

        div.className="review "+statusClass;

        div.innerHTML=

            '<div class="review-question">'+
            'Q'+(index+1)+'. '+question.q+
            '</div>'+

            '<div>'+statusText+'</div>'+

            '<div style="margin-top:7px;">'+
            '<b>Your Answer:</b> '+userAnswer+
            '</div>'+

            '<div class="correct-answer">'+
            'Correct Answer: '+question.a+
            '</div>'+

            '<div class="solution">'+
            '<strong>💡 Solution:</strong><br>'+
            question.s+
            '</div>';

        review.appendChild(div);

    });
}


/* INITIAL LOAD */

showQuestion();
