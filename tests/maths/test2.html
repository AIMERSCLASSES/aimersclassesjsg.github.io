/* ================= TEST VARIABLES ================= */

let currentQuestion = 0;

let answers =
new Array(questions.length).fill(null);

let submitted = false;


/* ================= TIMER ================= */

let totalSeconds = 90 * 60;

function updateTimer(){

    if(submitted) return;

    let minutes =
    Math.floor(totalSeconds / 60);

    let seconds =
    totalSeconds % 60;

    document.getElementById("timer").textContent =
    String(minutes).padStart(2,"0")
    + ":"
    + String(seconds).padStart(2,"0");

    if(totalSeconds <= 0){

        clearInterval(timerInterval);

        submitTest(true);

        return;
    }

    totalSeconds--;
}

const timerInterval =
setInterval(updateTimer,1000);

updateTimer();


/* ================= SHOW QUESTION ================= */

function showQuestion(){

    const q =
    questions[currentQuestion];

    document.getElementById("questionCount")
    .textContent =
    "Question "
    + (currentQuestion + 1)
    + " of "
    + questions.length;

    document.getElementById("question")
    .textContent =
    q.q;

    const optionsDiv =
    document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.o.forEach(function(option){

        const label =
        document.createElement("label");

        label.className = "option";

        const radio =
        document.createElement("input");

        radio.type = "radio";

        radio.name = "answer";

        radio.value = option;

        if(answers[currentQuestion] === option){
            radio.checked = true;
        }

        radio.addEventListener(
        "change",
        function(){

            answers[currentQuestion] =
            option;

            createPalette();

        });

        label.appendChild(radio);

        label.appendChild(
        document.createTextNode(
        " " + option
        ));

        optionsDiv.appendChild(label);

    });

    createPalette();
}


/* ================= PALETTE ================= */

function createPalette(){

    const palette =
    document.getElementById("palette");

    palette.innerHTML = "";

    questions.forEach(function(_,index){

        const button =
        document.createElement("button");

        button.textContent =
        index + 1;

        if(answers[index] !== null){

            button.classList.add(
            "attempted"
            );

        }

        button.onclick =
        function(){

            currentQuestion = index;

            showQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        palette.appendChild(button);

    });
}


/* ================= NEXT ================= */

function nextQuestion(){

    if(currentQuestion <
    questions.length - 1){

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });
    }
}


/* ================= PREVIOUS ================= */

function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });
    }
}


/* ================= SUBMIT ================= */

function submitTest(autoSubmit){

    if(submitted) return;

    if(!autoSubmit){

        const confirmSubmit =
        confirm(
        "Are you sure you want to submit the test?"
        );

        if(!confirmSubmit) return;
    }

    submitted = true;

    clearInterval(timerInterval);

    let correct = 0;
    let wrong = 0;
    let unattempted = 0;

    questions.forEach(function(question,index){

        if(answers[index] === null){

            unattempted++;

        }else if(
        answers[index] === question.a){

            correct++;

        }else{

            wrong++;

        }

    });

    const score =
    Math.max(
    0,
    correct - (wrong * 0.33)
    );

    document.getElementById("testArea")
    .style.display = "none";

    document.getElementById("result")
    .style.display = "block";

    document.getElementById("score")
    .textContent =
    score.toFixed(2);

    document.getElementById("correct")
    .textContent =
    correct;

    document.getElementById("wrong")
    .textContent =
    wrong;

    document.getElementById("unattempted")
    .textContent =
    unattempted;

    const review =
    document.getElementById("review");

    review.innerHTML = "";

    questions.forEach(function(question,index){

        let userAnswer =
        answers[index];

        let status = "";

        if(userAnswer === null){

            userAnswer =
            "Not Attempted";

            status =
            '<span class="unattempted">Not Attempted</span>';

        }else if(
        userAnswer === question.a){

            status =
            '<span class="correct">Correct ✓</span>';

        }else{

            status =
            '<span class="wrong">Wrong ✗</span>';

        }

        review.innerHTML +=

        '<div class="review">' +

        '<b>Q'
        + (index + 1)
        + '. '
        + question.q
        + '</b><br><br>' +

        'Your Answer: '
        + userAnswer
        + '<br>' +

        'Correct Answer: '
        + question.a
        + '<br>' +

        status +

        '</div>';

    });

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* ================= START TEST ================= */

showQuestion();

</script>
