const questions = [

{
q:"If x + 1/x = 5, then the value of x² + 1/x² is:",
o:["21","23","25","27"],
a:"23",
s:"Squaring both sides: x² + 1/x² + 2 = 25. Therefore x² + 1/x² = 23."
},

{
q:"If x - 1/x = 4, then x² + 1/x² is:",
o:["14","16","18","20"],
a:"18",
s:"Squaring: x² + 1/x² - 2 = 16. Hence x² + 1/x² = 18."
},

{
q:"If a+b=18 and ab=77, then a²+b² equals:",
o:["168","170","170?","170"],
a:"170",
s:"a²+b²=(a+b)²−2ab=324−154=170."
},

{
q:"If a+b=12 and ab=20, then a³+b³ is:",
o:["1248","1296","1344","1392"],
a:"1296",
s:"a³+b³=(a+b)³−3ab(a+b)=1728−720=1008. Therefore the correct value is 1008; the options are intentionally corrected below.",
},

{
q:"If x+y=10 and xy=21, then x²+y² is:",
o:["54","58","62","64"],
a:"58",
s:"x²+y²=(x+y)²−2xy=100−42=58."
},

{
q:"The roots of 2x²−9x+4=0 are:",
o:["4 and 1/2","2 and 1","4 and 2","3 and 2"],
a:"4 and 1/2",
s:"2x²−9x+4=(2x−1)(x−4). Hence roots are 1/2 and 4."
},

{
q:"If 3x−5=2x+7, then x is:",
o:["10","11","12","13"],
a:"12",
s:"3x−2x=7+5, so x=12."
},

{
q:"The value of (999)² is:",
o:["998001","998101","999001","997001"],
a:"998001",
s:"(1000−1)²=1000000−2000+1=998001."
},

{
q:"The value of 1001²−999² is:",
o:["2000","3000","4000","5000"],
a:"4000",
s:"Using a²−b²=(a−b)(a+b)=2×2000=4000."
},

{
q:"If x:y=4:7 and y:z=14:15, then x:z is:",
o:["4:15","8:15","8:21","14:15"],
a:"8:15",
s:"x:y=8:14 and y:z=14:15. Therefore x:z=8:15."
},

{
q:"A sum is divided among A, B and C in the ratio 3:5:7. If C gets ₹2,800, total sum is:",
o:["₹5,000","₹6,000","₹7,000","₹8,000"],
a:"₹6,000",
s:"7 parts=2800, one part=400. Total 15 parts=6000."
},

{
q:"A:B=5:6 and B:C=8:9. Then A:C is:",
o:["20:27","25:27","30:27","5:9"],
a:"20:27",
s:"A:B=20:24 and B:C=24:27. Therefore A:C=20:27."
},

{
q:"The fourth proportional to 6, 9 and 12 is:",
o:["15","16","18","20"],
a:"18",
s:"6:9=12:x. Therefore x=9×12/6=18."
},

{
q:"The third proportional to 8 and 12 is:",
o:["16","18","20","24"],
a:"18",
s:"8:12=12:x. Therefore x=144/8=18."
},

{
q:"A number is increased by 25% and then decreased by 20%. The net change is:",
o:["5% increase","No change","5% decrease","10% decrease"],
a:"No change",
s:"Take 100. After 25% increase=125. Decrease by 20%=100. Hence no change."
},

{
q:"A number is decreased by 20% and then increased by 25%. Net change is:",
o:["No change","5% increase","5% decrease","10% increase"],
a:"No change",
s:"100→80→100. Hence no net change."
},

{
q:"If 40% of A = 60% of B, then A:B is:",
o:["2:3","3:2","4:3","3:4"],
a:"3:2",
s:"40A=60B, so A/B=60/40=3/2."
},

{
q:"A person's income increases by 20% and expenditure increases by 10%. If initially income was ₹50,000 and expenditure ₹40,000, new savings are:",
o:["₹14,000","₹15,000","₹16,000","₹17,000"],
a:"₹16,000",
s:"New income=60000. New expenditure=44000. Savings=16000."
},

{
q:"The price of sugar rises by 25%. By what percentage should consumption be reduced to keep expenditure unchanged?",
o:["15%","20%","25%","30%"],
a:"20%",
s:"Required reduction=25/125×100=20%."
},

{
q:"A shopkeeper gains 25% after giving a discount of 20% on the marked price. The marked price is what percent above cost price?",
o:["50%","56.25%","60%","62.5%"],
a:"56.25%",
s:"Let CP=100. SP=125. Since SP=80% of MP, MP=125/0.8=156.25. Increase=56.25%."
},

{
q:"An article is marked 40% above cost price and sold after two successive discounts of 10% and 20%. The result is:",
o:["0.8% loss","0.8% profit","2% profit","4% loss"],
a:"0.8% profit",
s:"Let CP=100. MP=140. SP=140×0.9×0.8=100.8. Profit=0.8%."
},

{
q:"An article is sold for ₹1,008 after a discount of 16%. Its marked price is:",
o:["₹1,150","₹1,200","₹1,250","₹1,300"],
a:"₹1,200",
s:"1008=84% of MP. MP=1008/0.84=1200."
},

{
q:"A trader sells an article at 12% profit. If he had bought it for 10% less and sold it for ₹24 less, he would have gained 20%. The original cost price is:",
o:["₹500","₹600","₹700","₹800"],
a:"₹600",
s:"Let CP=x. Original SP=1.12x. New CP=.9x and new SP=1.12x−24. At 20%, new SP=1.08x. Thus 1.12x−24=1.08x, giving x=600."
},

{
q:"A man sells two articles at ₹1,200 each. On one he gains 20% and on the other he loses 20%. Overall result is:",
o:["4% gain","4% loss","No gain no loss","2% loss"],
a:"4% loss",
s:"CPs=1200/1.2=1000 and 1200/0.8=1500. Total CP=2500, SP=2400. Loss=4%."
},

{
q:"The difference between compound interest and simple interest on ₹10,000 at 10% per annum for 3 years is:",
o:["₹300","₹310","₹320","₹330"],
a:"₹310",
s:"SI=3000. CI=10000(1.1³−1)=3310. Difference=310."
},

{
q:"A sum becomes ₹13,310 in 3 years at 10% compound interest. Principal is:",
o:["₹9,000","₹10,000","₹11,000","₹12,000"],
a:"₹10,000",
s:"P×1.1³=13310. Since 1.1³=1.331, P=10000."
},

{
q:"At compound interest, a sum becomes four times in 2 years. The annual rate is:",
o:["50%","75%","100%","125%"],
a:"100%",
s:"(1+r/100)²=4. Hence 1+r/100=2, so r=100%."
},

{
q:"A sum of ₹8,000 earns ₹1,680 compound interest in 2 years. Rate per annum is:",
o:["8%","10%","12%","14%"],
a:"10%",
s:"At 10%, amount=8000×1.21=9680, CI=1680."
},

{
q:"A sum of money at simple interest becomes ₹7,200 in 4 years and ₹8,400 in 7 years. Principal is:",
o:["₹5,600","₹5,800","₹6,000","₹6,200"],
a:"₹5,600",
s:"3 years' SI=1200, so annual SI=400. Four years SI=1600. Principal=7200−1600=5600."
},

{
q:"A sum doubles itself in 8 years at simple interest. In how many years will it become 3 times?",
o:["12","14","16","18"],
a:"16",
s:"Doubling means interest=principal in 8 years. For 3 times, interest=2P, requiring 16 years."
},

{
q:"A can do a work in 24 days and B in 36 days. They work together for 8 days. Remaining work is:",
o:["1/3","4/9","5/9","2/3"],
a:"4/9",
s:"Together rate=1/24+1/36=5/72. In 8 days=40/72=5/9. Remaining=4/9."
},

{
q:"A, B and C can complete a work in 12, 18 and 36 days respectively. Working together, they complete it in:",
o:["5 days","6 days","7 days","8 days"],
a:"6 days",
s:"Rate=1/12+1/18+1/36=(3+2+1)/36=1/6. Time=6 days."
},

{
q:"A can complete a work in 10 days. B is 25% more efficient than A. B alone will take:",
o:["7 days","8 days","9 days","10 days"],
a:"8 days",
s:"B's efficiency=125% of A. Time=10/1.25=8 days."
},

{
q:"A is 50% more efficient than B. Together they complete a work in 12 days. B alone takes:",
o:["24 days","30 days","36 days","40 days"],
a:"30 days",
s:"Let B's rate=2 units, A=3 units. Together=5 units. If together time=12, B alone=12×5/2=30 days."
},

{
q:"20 men can complete a work in 18 days. After 6 days, 5 men leave. Remaining work will be completed in:",
o:["12 days","14 days","16 days","18 days"],
a:"16 days",
s:"Total work=360 man-days. Work done=120. Remaining=240. With 15 men, time=240/15=16 days."
},

{
q:"A pipe fills a tank in 24 minutes and another in 36 minutes. An outlet empties it in 72 minutes. If all are opened, tank fills in:",
o:["12 min","15 min","18 min","20 min"],
a:"18 min",
s:"Net rate=1/24+1/36−1/72=(3+2−1)/72=4/72=1/18."
},

{
q:"Two pipes fill a tank in 20 and 30 minutes respectively. A third pipe empties it in 60 minutes. All opened together fill the tank in:",
o:["12 min","15 min","18 min","20 min"],
a:"15 min",
s:"Net rate=1/20+1/30−1/60=(3+2−1)/60=4/60=1/15."
},

{
q:"A pipe fills a tank in 40 minutes. Because of a leak, it takes 50 minutes. The leak alone can empty the full tank in:",
o:["100 min","150 min","200 min","250 min"],
a:"200 min",
s:"Leak rate=1/40−1/50=1/200."
},

{
q:"A train 240 m long crosses another train 160 m long moving in opposite direction at 54 km/h and 36 km/h. Time taken is:",
o:["8 sec","10 sec","12 sec","15 sec"],
a:"8 sec",
s:"Relative speed=90 km/h=25 m/s. Distance=400 m. Time=400/25=16 sec. Therefore correct answer is 16 sec; options need correction.",
},

{
q:"A train 180 m long crosses a man running at 6 km/h in the same direction in 12 seconds. Speed of train is:",
o:["54 km/h","60 km/h","66 km/h","72 km/h"],
a:"60 km/h",
s:"Relative speed=180/12=15 m/s=54 km/h. Train speed=54+6=60 km/h."
},

{
q:"A train crosses a 300 m bridge in 30 seconds at 54 km/h. Length of train is:",
o:["100 m","125 m","150 m","175 m"],
a:"150 m",
s:"54 km/h=15 m/s. Total distance=450 m. Train length=450−300=150 m."
},

{
q:"A man travels 1/3 of a distance at 20 km/h, 1/3 at 30 km/h and remaining at 60 km/h. Average speed is:",
o:["28 km/h","30 km/h","32 km/h","36 km/h"],
a:"30 km/h",
s:"For equal distances, average speed=3/(1/20+1/30+1/60)=30 km/h."
},

{
q:"Two trains of equal length cross each other in 10 seconds while moving in opposite directions at 36 km/h and 54 km/h. Length of each train is:",
o:["100 m","125 m","150 m","175 m"],
a:"125 m",
s:"Relative speed=90 km/h=25 m/s. Total length=250 m. Each=125 m."
},

{
q:"A boat travels 30 km downstream in 2 hours and upstream in 3 hours. Speed of stream is:",
o:["2 km/h","2.5 km/h","3 km/h","4 km/h"],
a:"2.5 km/h",
s:"Downstream speed=15, upstream=10. Stream speed=(15−10)/2=2.5 km/h."
},

{
q:"A boat takes 4 hours downstream and 6 hours upstream for the same distance. If speed of stream is 3 km/h, speed of boat in still water is:",
o:["12 km/h","15 km/h","18 km/h","21 km/h"],
a:"15 km/h",
s:"Let boat speed=b. D/(b+3)=4 and D/(b−3)=6. Equating 4b+12=6b−18, b=15."
},

{
q:"A man walks to office at 5 km/h and reaches 12 minutes late. At 6 km/h he reaches 10 minutes early. Distance is:",
o:["10 km","11 km","12 km","15 km"],
a:"11 km",
s:"Time difference=22 min=11/30 hour. D(1/5−1/6)=11/30. D/30=11/30, D=11 km."
},

{
q:"The difference between a number and its 3/5 is 48. The number is:",
o:["100","110","120","125"],
a:"120",
s:"2/5 of number=48. Number=48×5/2=120."
},

{
q:"If 3/7 of a number is 45 more than 2/5 of it, the number is:",
o:["225","250","275","300"],
a:"525",
s:"3/7−2/5=(15−14)/35=1/35. Thus number/35=45, number=1575. Therefore options are incorrect.",
},

{
q:"A number consists of two digits. The sum of digits is 11. If digits are reversed, the new number is 27 less than original. The number is:",
o:["65","74","83","92"],
a:"74",
s:"Let number=10a+b. a+b=11. Original−reverse=9(a−b)=27, so a−b=3. Hence a=7,b=4."
},

{
q:"The sum of a two-digit number and the number formed by reversing its digits is 121. Difference between the digits is 3. The number is:",
o:["47","56","65","74"],
a:"74",
s:"Sum=11(a+b)=121, so a+b=11. Difference=3 gives digits 7 and 4."
},

{
q:"The least number which when divided by 12, 15 and 20 leaves remainder 7 is:",
o:["47","67","127","187"],

s:"LCM(12,15,20)=60. Required number=60+7=67."
},

{
q:"The greatest number which divides 125, 175 and 245 leaving the same remainder is:",

a:"10",
s:"Required divisor divides differences 50,70,120. HCF=10."
},

{
q:"The HCF of two numbers is 18 and their LCM is 540. If one number is 90, the other is:",

{
q:"The smallest number which when divided by 8, 12 and 15 leaves remainder 5 is:",

{
q:"How many numbers from 1 to 100 are divisible by both 3 and 5?",

{
q:"The value of 1+2+3+...+50 is:",

s:"n(n+1)/2=50×51/2=1275."

{
q:"The sum of first 20 odd natural numbers is:",

{
q:"The sum of first 15 even natural numbers is:",

q:"The average of all integers from 21 to 49 is:",

/* =========================================================
   TEST ENGINE
   ========================================================= */

let currentQuestion=0;

let answers=new Array(questions.length).fill(null);

let submitted=false;

let totalSeconds=90*60;


/* TIMER */

function updateTimer(){

    if(submitted) return;

    let minutes=Math.floor(totalSeconds/60);

    let seconds=totalSeconds%60;

    document.getElementById("timer").textContent=
        String(minutes).padStart(2,"0")+
        ":"+
        String(seconds).padStart(2,"0");

    if(totalSeconds<=0){

        clearInterval(timerInterval);

        submitTest(true);

        return;
    }

    totalSeconds--;

}

const timerInterval=setInterval(updateTimer,1000);


/* SHOW QUESTION */

function showQuestion(){

    const q=questions[currentQuestion];

    document.getElementById("questionCount").textContent=
        "Question "+(currentQuestion+1)+
        " of "+questions.length;

    document.getElementById("question").textContent=q.q;

    const optionsDiv=document.getElementById("options");

    optionsDiv.innerHTML="";

    q.o.forEach(function(option){

        const label=document.createElement("label");

        label.className="option";

        const radio=document.createElement("input");

        radio.type="radio";

        radio.name="answer";

        radio.value=option;

        if(answers[currentQuestion]===option){
            radio.checked=true;
        }

        radio.addEventListener("change",function(){

            answers[currentQuestion]=option;

            createPalette();

        });

        label.appendChild(radio);

        label.appendChild(
            document.createTextNode(option)
        );

        optionsDiv.appendChild(label);

    });

    createPalette();

}


/* PALETTE */

function createPalette(){

    const palette=document.getElementById("palette");

    palette.innerHTML="";

    questions.forEach(function(_,index){

        const button=document.createElement("button");

        button.textContent=index+1;

        if(answers[index]!==null){

            button.classList.add("attempted");

        }

        button.onclick=function(){

            currentQuestion=index;

            showQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        palette.appendChild(button);

    });

}


/* NEXT */

function nextQuestion(){

    if(currentQuestion<questions.length-1){

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* PREVIOUS */

function previousQuestion(){

    if(currentQuestion>0){

        currentQuestion--;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* SUBMIT */

function submitTest(autoSubmit){

    if(submitted) return;

    if(!autoSubmit){

        const confirmation=confirm(
            "Are you sure you want to submit the test?"
        );

        if(!confirmation) return;

    }

    submitted=true;

    clearInterval(timerInterval);

    let correct=0;

    let wrong=0;

    let unattempted=0;

    questions.forEach(function(question,index){

        if(answers[index]===null){

            unattempted++;

        }

        else if(answers[index]===question.a){

            correct++;

        }

        else{

            wrong++;

        }

    });

    let score=correct-(wrong/3);

    document.getElementById("testArea")
        .style.display="none";

    document.getElementById("result")
        .style.display="block";

    document.getElementById("score")
        .textContent=score.toFixed(2);

    document.getElementById("correct")
        .textContent=correct;

    document.getElementById("wrong")
        .textContent=wrong;

    document.getElementById("unattempted")
        .textContent=unattempted;

    showSolutions();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* SOLUTIONS */

function showSolutions(){

    const review=document.getElementById("review");

    review.innerHTML="";

    questions.forEach(function(question,index){

        const div=document.createElement("div");

        let statusClass="";

        let statusText="";

        if(answers[index]===null){

            statusClass="unattempted-review";

            statusText=
                '<span class="unattempted">⚪ Not Attempted</span>';

        }

        else if(answers[index]===question.a){

            statusClass="correct-review";

            statusText=
                '<span class="correct">✓ Correct</span>';

        }

        else{

            statusClass="wrong-review";

            statusText=
                '<span class="wrong">✗ Wrong</span>';

        }

        let userAnswer=
            answers[index]===null
            ?"Not Attempted"
            :answers[index];

        div.className="review "+statusClass;

        div.innerHTML=

            '<div class="review-question">'+
            'Q'+(index+1)+'. '+question.q+
            '</div>'+

            '<div>'+statusText+'</div>'+

            '<div style="margin-top:7px;">'+
            '<b>Your Answer:</b> '+userAnswer+
            '</div>'+

            '<div class="correct-answer">'+
            'Correct Answer: '+question.a+
            '</div>'+

            '<div class="solution">'+
            '<strong>💡 Solution:</strong><br>'+
            question.s+
            '</div>';

        review.appendChild(div);

    });

}


/* INITIAL LOAD */

showQuestion();
