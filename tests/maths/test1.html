header{

.header-inner{

.logo{

.test-name{

.timer{
    background:#fff;

    border-radius:8px;
    font-size:20px;
    font-weight:900;
    min-width:110px;
    text-align:center;
}

.container{
    max-width:1250px;
    margin:20px auto;
    padding:0 2%;
}

.layout{
    display:grid;
    grid-template-columns:1fr 290px;
    gap:20px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:25px;
    box-shadow:0 6px 25px rgba(0,0,0,.08);
}

.question-count{
    color:#1d4ed8;
    font-size:16px;
    font-weight:900;
    margin-bottom:12px;
}

.question{
    font-size:20px;
    font-weight:700;
    line-height:1.55;
    margin-bottom:24px;
}

.option{
    display:block;
    border:1px solid #d7dee9;
    border-radius:10px;
    padding:14px 15px;
    margin:11px 0;
    cursor:pointer;
    transition:.2s;
    background:#fff;
}

.option:hover{
    background:#eef4ff;
    border-color:#1d4ed8;
}

.option input{
    margin-right:10px;
    cursor:pointer;
}

.navigation{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:25px;
}

.nav-btn{
    border:none;
    border-radius:8px;
    padding:12px 22px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.previous{
    background:#64748b;
    color:#fff;
}

.next{
    background:#1d4ed8;
    color:#fff;
}

.palette-card{
    height:max-content;
    position:sticky;
    top:90px;
}

.palette-card h3{
    color:#102a43;
    margin-bottom:12px;
}

.legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    font-size:12px;
    margin-bottom:15px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:5px;
}

.legend-box{
    width:14px;
    height:14px;
    border-radius:4px;
}

.red-box{
    background:#ef4444;
}

.green-box{
    background:#16a34a;
}

.palette{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.palette button{
    height:38px;
    border:none;
    border-radius:6px;
    background:#ef4444;
    color:#fff;
    font-weight:800;
    cursor:pointer;
}

.palette button.attempted{
    background:#16a34a;
}

.submit-btn{
    width:100%;
    margin-top:18px;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#16a34a;
    color:#fff;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

.result{
    display:none;
}

.result h2{
    color:#102a43;
    margin-bottom:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:#f1f5f9;
    padding:16px 8px;
    border-radius:10px;
    text-align:center;
    font-weight:800;
}

.stat-value{
    font-size:25px;
    color:#1d4ed8;
    margin-top:5px;
}

.review{
    margin-top:12px;
    padding:15px;
    border-radius:9px;
    background:#f8fafc;
    border-left:5px solid #1d4ed8;
}

.correct{
    color:#15803d;
    font-weight:800;
}

.wrong{
    color:#dc2626;
    font-weight:800;
}

.unattempted{
    color:#d97706;
    font-weight:800;
}

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .palette-card{
        position:static;
        order:-1;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .header-inner{
        flex-direction:column;
        text-align:center;
    }

    .timer{
        width:100%;
    }

    .card{
        padding:18px;
    }

    .question{
        font-size:18px;
    }

    .navigation{
        flex-direction:column;
    }

    .nav-btn{
        width:100%;
    }
}
</style>
</head>

q:"How many 3-digit numbers can be formed using digits 1,2,3,4,5 without repetition?",
o:["30","40","60","100"],
a:"60"
},

{
q:"A committee of 3 is to be selected from 8 persons. Number of ways is:",
o:["24","48","56","64"],
a:"56"
},

{
q:"A right circular cone has radius 7 cm and height 24 cm. Its slant height is:",
o:["23 cm","24 cm","25 cm","26 cm"],
a:"25 cm"
},

{
q:"The volume of a sphere of radius 3 cm is:",
o:["36π cm³","72π cm³","108π cm³","144π cm³"],
a:"36π cm³"
},

{
q:"The curved surface area of a cone of radius 7 cm and slant height 25 cm is:",
o:["154π cm²","175π cm²","350π cm²","700π cm²"],
a:"175π cm²"
},

{
q:"The distance between points (3,4) and (7,7) is:",
o:["4","5","6","7"],
a:"5"
},

{
q:"The midpoint of (2,5) and (8,11) is:",
o:["(4,7)","(5,8)","(6,8)","(5,9)"],
a:"(5,8)"
},

{
q:"The slope of the line joining (2,3) and (6,11) is:",
o:["1","2","3","4"],
a:"2"
}

];


/* ================= VARIABLES ================= */

let currentQuestion = 0;

let answers =
new Array(questions.length).fill(null);

let submitted = false;


/* ================= 90 MINUTE TIMER ================= */

let totalSeconds = 90 * 60;


function updateTimer(){

    if(submitted){
        return;
    }

    let minutes =
    Math.floor(totalSeconds / 60);

    let seconds =
    totalSeconds % 60;

    document.getElementById("timer").textContent =
    String(minutes).padStart(2,"0")
    + ":"
    + String(seconds).padStart(2,"0");


    if(totalSeconds <= 0){

        clearInterval(timerInterval);

        submitTest(true);

        return;
    }

    totalSeconds--;

}


const timerInterval =
setInterval(updateTimer,1000);

updateTimer();



/* ================= SHOW QUESTION ================= */

function showQuestion(){

    const q =
    questions[currentQuestion];


    document.getElementById("questionCount")
    .textContent =
    "Question "
    + (currentQuestion + 1)
    + " of "
    + questions.length;


    document.getElementById("question")
    .textContent =
    q.q;


    const optionsDiv =
    document.getElementById("options");

    optionsDiv.innerHTML = "";


    q.o.forEach(function(option){

        const label =
        document.createElement("label");

        label.className =
        "option";


        const radio =
        document.createElement("input");

        radio.type =
        "radio";

        radio.name =
        "answer";

        radio.value =
        option;


        if(
        answers[currentQuestion]
        === option
        ){

            radio.checked = true;

        }


        radio.addEventListener(
        "change",
        function(){

            answers[currentQuestion] =
            option;

            createPalette();

        });


        label.appendChild(radio);

        label.appendChild(
        document.createTextNode(
        " " + option
        )
        );


        optionsDiv.appendChild(label);

    });


    createPalette();

}



/* ================= PALETTE ================= */

function createPalette(){

    const palette =
    document.getElementById("palette");

    palette.innerHTML = "";


    questions.forEach(
    function(_,index){

        const button =
        document.createElement("button");


        button.textContent =
        index + 1;


        if(
        answers[index] !== null
        ){

            button.classList.add(
            "attempted"
            );

        }


        button.onclick =
        function(){

            currentQuestion =
            index;

            showQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };


        palette.appendChild(button);

    });

}



/* ================= NEXT ================= */

function nextQuestion(){

    if(
    currentQuestion <
    questions.length - 1
    ){

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}



/* ================= PREVIOUS ================= */

function previousQuestion(){

    if(
    currentQuestion > 0
    ){

        currentQuestion--;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}



/* ================= SUBMIT ================= */

function submitTest(autoSubmit){

    if(submitted){
        return;
    }


    if(!autoSubmit){

        const confirmSubmit =
        confirm(
        "Are you sure you want to submit the test?"
        );


        if(!confirmSubmit){
            return;
        }

    }


    submitted = true;

    clearInterval(timerInterval);


    let correct = 0;

    let wrong = 0;

    let unattempted = 0;


    questions.forEach(
    function(question,index){

        if(
        answers[index] === null
        ){

            unattempted++;

        }

        else if(
        answers[index] === question.a
        ){

            correct++;

        }

        else{

            wrong++;

        }

    });


    const score =
    Math.max(
    0,
    correct - (wrong * 0.33)
    );


    document.getElementById(
    "testArea"
    ).style.display =
    "none";


    document.getElementById(
    "result"
    ).style.display =
    "block";


    document.getElementById(
    "score"
    ).textContent =
    score.toFixed(2);


    document.getElementById(
    "correct"
    ).textContent =
    correct;


    document.getElementById(
    "wrong"
    ).textContent =
    wrong;


    document.getElementById(
    "unattempted"
    ).textContent =
    unattempted;


    const review =
    document.getElementById(
    "review"
    );


    review.innerHTML = "";


    questions.forEach(
    function(question,index){

        let userAnswer =
        answers[index];

        let status = "";


        if(
        userAnswer === null
        ){

            userAnswer =
            "Not Attempted";

            status =
            '<span class="unattempted">Not Attempted</span>';

        }

        else if(
        userAnswer === question.a
        ){

            status =
            '<span class="correct">Correct ✓</span>';

        }

        else{

            status =
            '<span class="wrong">Wrong ✗</span>';

        }


        review.innerHTML +=

        '<div class="review">' +

        '<b>Q'
        + (index + 1)
        + '. '
        + question.q
        + '</b><br><br>' +

        'Your Answer: '
        + userAnswer
        + '<br>' +

        'Correct Answer: '
        + question.a
        + '<br>' +

        status +

        '</div>';

    });


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}



/* ================= START ================= */

showQuestion();

</script>
