<html lang="en">

<head>

<title>AIMERS CLASSES | RRB NTPC Maths Test 9</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
    line-height:1.6;
}

/* HEADER */

header{
    background:linear-gradient(135deg,#102a43,#1d4ed8);
    color:white;
    padding:14px 3%;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.header-inner{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#ffd43b;
}

.test-name{
    font-size:14px;
    color:#dbeafe;
    margin-top:3px;
}

.timer{
    background:white;
    color:#dc2626;
    padding:9px 18px;
    border-radius:8px;
    font-size:21px;
    font-weight:900;
    min-width:110px;
    text-align:center;
}

/* CONTAINER */

.container{
    max-width:1250px;
    margin:20px auto;
    padding:0 2%;
}

.layout{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:20px;
}

/* CARD */

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 6px 25px rgba(0,0,0,.08);
}

/* QUESTION */

.question-count{
    color:#1d4ed8;
    font-size:16px;
    font-weight:900;
    margin-bottom:12px;
}

.question{
    font-size:20px;
    font-weight:700;
    line-height:1.65;
    margin-bottom:25px;
}

.option{
    display:block;
    border:1px solid #d7dee9;
    border-radius:10px;
    padding:14px 15px;
    margin:11px 0;
    cursor:pointer;
    transition:.2s;
    background:white;
}

.option:hover{
    background:#eef4ff;
    border-color:#1d4ed8;
}

.option input{
    margin-right:10px;
}

/* NAVIGATION */

.navigation{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:25px;
}

.nav-btn{
    border:none;
    border-radius:8px;
    padding:12px 22px;
    font-weight:800;
    cursor:pointer;
}

.previous{
    background:#64748b;
    color:white;
}

.next{
    background:#1d4ed8;
    color:white;
}

/* PALETTE */

.palette-card{
    height:max-content;
    position:sticky;
    top:95px;
}

.palette-card h3{
    color:#102a43;
    margin-bottom:13px;
}

.legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    font-size:12px;
    margin-bottom:15px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:5px;
}

.legend-box{
    width:14px;
    height:14px;
    border-radius:4px;
}

.red-box{
    background:#ef4444;
}

.green-box{
    background:#16a34a;
}

.palette{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.palette button{
    height:38px;
    border:none;
    border-radius:6px;
    background:#ef4444;
    color:white;
    font-weight:800;
    cursor:pointer;
}

.palette button.attempted{
    background:#16a34a;
}

.submit-btn{
    width:100%;
    margin-top:18px;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

/* RESULT */

.result{
    display:none;
}

.result h2{
    color:#102a43;
    margin-bottom:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:#f1f5f9;
    padding:16px 8px;
    border-radius:10px;
    text-align:center;
    font-weight:800;
}

.stat-value{
    font-size:25px;
    color:#1d4ed8;
    margin-top:5px;
}

.review-title{
    margin-top:30px;
    margin-bottom:15px;
    color:#102a43;
}

.review{
    margin-top:14px;
    padding:18px;
    border-radius:10px;
    background:#f8fafc;
    border-left:5px solid #64748b;
}

.correct-review{
    border-left-color:#16a34a;
}

.wrong-review{
    border-left-color:#dc2626;
}

.unattempted-review{
    border-left-color:#d97706;
}

.review-question{
    font-weight:800;
    margin-bottom:10px;
}

.correct-answer{
    margin-top:7px;
    color:#15803d;
    font-weight:800;
}

.solution{
    margin-top:12px;
    padding:13px;
    background:white;
    border-radius:8px;
    border:1px solid #e2e8f0;
}

.solution strong{
    color:#1d4ed8;
}

.correct{
    color:#15803d;
    font-weight:800;
}

.wrong{
    color:#dc2626;
    font-weight:800;
}

.unattempted{
    color:#d97706;
    font-weight:800;
}

/* MOBILE */

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .palette-card{
        position:static;
        order:-1;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .header-inner{
        flex-direction:column;
        text-align:center;
    }

    .timer{
        width:100%;
    }

    .card{
        padding:18px;
    }

    .question{
        font-size:18px;
    }

    .navigation{
        flex-direction:column;
    }

    .nav-btn{
        width:100%;
    }

}

</style>

</head>

{
q:"The value of 0.25 × 0.4 is:",

{

{

{
q:"A number is increased by 20% and then decreased by 20%. Net change is:",

{
q:"A salary of ₹20,000 is increased by 15%. New salary is:",

},

{
q:"The average of 8 numbers is 24. If one number 31 is removed, average of remaining numbers is:",

},

{
q:"Average of first 15 natural numbers is:",

},

{
q:"The average age of 5 persons is 26 years. If a new person joins, average becomes 28 years. Age of new person is:",

{
q:"The average of 7 consecutive integers is 45. The largest integer is:",

{
q:"A:B=3:5 and B:C=10:7. Then A:B:C is:",
o:["3:5:7","6:10:7","6:5:7","3:10:7"],

{
q:"₹7,200 is divided in the ratio 5:7. Larger share is:",
o:["₹3,000","₹3,600","₹4,000","₹4,200"],
a:"₹4,200",
s:"Total parts=12. Larger share=7200×7/12=4200."

{
q:"If x:y=7:9 and y:z=3:5, then x:z is:",
o:["7:15","21:45","7:5","9:15"],

{
q:"Two numbers are in ratio 4:7. Their sum is 99. Smaller number is:",
o:["30","36","42","45"],

{
q:"An article costs ₹800 and is sold at 15% profit. Selling price is:",

{
q:"An article sold for ₹720 gives a loss of 10%. Cost price is:",
o:["₹760","₹800","₹820","₹900"],

s:"720=90% of CP. CP=720×100/90=800."
},

{
q:"A shopkeeper marks an article 25% above cost price and gives 10% discount. Profit percentage is:",
o:["10%","12.5%","15%","20%"],
a:"12.5%",
s:"CP=100. MP=125. SP=125×90/100=112.5. Profit=12.5%."
},

{
q:"An article marked ₹2,000 is sold at 15% discount. Selling price is:",
o:["₹1,650","₹1,700","₹1,750","₹1,800"],
a:"₹1,700",
s:"Discount=300. SP=1700."
},

{
q:"A trader gains 20% by selling an article for ₹1,440. Cost price is:",
o:["₹1,100","₹1,200","₹1,250","₹1,300"],

{
q:"An article is sold at 8% loss for ₹1,150. Its cost price is:",

{
q:"Simple interest on ₹6,000 at 8% per annum for 3 years is:",
o:["₹1,200","₹1,440","₹1,600","₹1,800"],

s:"SI=6000×8×3/100=1440."
},

{
q:"A sum amounts to ₹7,200 in 2 years at 10% simple interest. Principal is:",
o:["₹5,500","₹6,000","₹6,200","₹6,500"],

s:"Amount=P(1+20/100)=1.2P. P=7200/1.2=6000."

{
q:"Compound interest on ₹5,000 at 10% per annum for 2 years is:",
o:["₹1,000","₹1,050","₹1,100","₹1,150"],

s:"Amount=5000×1.1²=6050. CI=1050."

{
q:"The difference between CI and SI on ₹8,000 at 5% for 2 years is:",
o:["₹10","₹20","₹25","₹40"],

},

{
q:"At what rate of SI will ₹4,000 earn ₹960 in 3 years?",
o:["6%","7%","8%","9%"],
a:"8%",
s:"R=960×100/(4000×3)=8%."
},

{
q:"A can complete a work in 20 days and B in 30 days. Together they can complete it in:",
o:["10 days","12 days","15 days","18 days"],
a:"12 days",
s:"Combined rate=1/20+1/30=5/60=1/12. Time=12 days."
},

{
q:"A and B together complete a work in 12 days. A alone takes 20 days. B alone takes:",
o:["25 days","30 days","35 days","40 days"],
a:"30 days",
s:"B rate=1/12−1/20=(5−3)/60=1/30."
},

{
q:"A is twice as efficient as B. If B takes 24 days, A takes:",
o:["8 days","12 days","16 days","18 days"],
a:"12 days",
s:"Efficiency is inverse of time. A takes half of B's time=12 days."

{
q:"12 men can complete a work in 15 days. How many men are required to complete it in 10 days?",
o:["15","18","20","24"],
a:"18",
s:"Men×days constant=12×15=180. Men=180/10=18."
},

{
q:"A pipe fills a tank in 18 minutes and another in 27 minutes. Together they fill it in:",
o:["9 min","10 4/5 min","12 min","15 min"],
a:"10 4/5 min",
s:"Rate=1/18+1/27=(3+2)/54=5/54. Time=54/5=10.8 minutes."
},

{
q:"A pipe fills a tank in 15 minutes and an outlet empties it in 30 minutes. Together they fill the tank in:",
o:["15 min","20 min","25 min","30 min"],
a:"30 min",
s:"Net rate=1/15−1/30=1/30."
},

{
q:"A train runs at 54 km/h. Its speed in m/s is:",
o:["12","15","18","20"],
a:"15",
s:"54×5/18=15 m/s."
},

{
q:"A train 180 m long crosses a pole in 12 seconds. Speed is:",
o:["45 km/h","54 km/h","60 km/h","72 km/h"],
a:"54 km/h",
s:"Speed=180/12=15 m/s=54 km/h."
},

{
q:"A train 150 m long running at 72 km/h crosses a platform in 20 seconds. Platform length is:",
o:["200 m","225 m","250 m","300 m"],
a:"250 m",
s:"Speed=20 m/s. Total distance=20×20=400 m. Platform=400−150=250 m."
},

{
q:"A man travels 60 km at 30 km/h and returns at 20 km/h. Average speed is:",
o:["22 km/h","24 km/h","25 km/h","26 km/h"],
a:"24 km/h",
s:"Equal distance average speed=2ab/(a+b)=2×30×20/50=24."
},

{
q:"A car covers 180 km in 3 hours. Its speed is:",
o:["50 km/h","55 km/h","60 km/h","65 km/h"],
a:"60 km/h",
s:"Speed=180/3=60 km/h."
},

{
q:"A boat moves downstream at 16 km/h and upstream at 10 km/h. Speed of stream is:",
o:["2 km/h","3 km/h","4 km/h","5 km/h"],
a:"3 km/h",
s:"Stream speed=(16−10)/2=3 km/h."
},

{
q:"A boat covers 45 km downstream in 3 hours and the same distance upstream in 5 hours. Speed in still water is:",
o:["10 km/h","12 km/h","15 km/h","18 km/h"],
a:"12 km/h",
s:"Downstream=15, upstream=9. Still-water speed=(15+9)/2=12 km/h."
},

{
q:"If x+1/x=4, then x²+1/x² equals:",
o:["12","14","16","18"],
a:"14",
s:"Squaring: x²+1/x²+2=16. Therefore value=14."
},

{
q:"If x−1/x=3, then x²+1/x² equals:",
o:["9","11","13","15"],
a:"11",
s:"Squaring gives x²+1/x²−2=9. Hence 11."
},

{
q:"If a+b=15 and ab=44, then a²+b² is:",
o:["137","145","157","169"],
a:"137",
s:"a²+b²=(a+b)²−2ab=225−88=137."
},

{
q:"The roots of x²−11x+30=0 are:",
o:["3,10","4,7","5,6","2,15"],
a:"5,6",
s:"x²−11x+30=(x−5)(x−6)."
},

{
q:"If 4x−7=21, x equals:",
o:["5","6","7","8"],
a:"7",
s:"4x=28, x=7."
},

{
q:"If 2x/5=18, x is:",
o:["36","40","45","50"],
a:"45",
s:"x=18×5/2=45."
},

{
q:"The sum of angles of a quadrilateral is:",
o:["180°","270°","360°","540°"],
a:"360°",
s:"Sum=(4−2)×180=360°."
},

{
q:"Each angle of a regular hexagon is:",
o:["100°","110°","120°","135°"],
a:"120°",
s:"Interior angle=(6−2)×180/6=120°."
},

{
q:"The angles of a triangle are in ratio 2:3:4. Largest angle is:",
o:["60°","70°","80°","90°"],
a:"80°",
s:"Total parts=9. One part=20°. Largest=4×20=80°."
},

{
q:"An exterior angle of a triangle is 130°. One opposite interior angle is 55°. Other opposite angle is:",
o:["65°","70°","75°","80°"],
a:"75°",
s:"Exterior angle=sum of two opposite interior angles. Other=130−55=75°."
},

{
q:"The radius of a circle is 7 cm. Its circumference is, using π=22/7:",
o:["22 cm","44 cm","49 cm","154 cm"],
a:"44 cm",
s:"Circumference=2πr=2×22/7×7=44 cm."
},

{
q:"Area of a circle of radius 14 cm is:",
o:["308 cm²","616 cm²","628 cm²","704 cm²"],

s:"Area=22/7×14×14=616 cm²."
},

{
q:"A rectangle has length 24 cm and breadth 15 cm. Its perimeter is:",
o:["68 cm","72 cm","78 cm","80 cm"],

},

{
q:"The diagonal of a square is 10√2 cm. Its side is:",
o:["5 cm","10 cm","15 cm","20 cm"],

},

{
q:"The volume of a cube of side 6 cm is:",
o:["108 cm³","180 cm³","216 cm³","256 cm³"],

s:"Volume=6³=216 cm³."
},

{
q:"Total surface area of a cuboid 10 cm × 6 cm × 4 cm is:",

q:"The curved surface area of a cylinder of radius 7 cm and height 5 cm is:",

{
q:"The volume of a sphere of radius 3 cm is:",

{
q:"If the radius of a circle is doubled, its area becomes:",

{

q:"The value of sin²30° + cos²30° is:",

/* =========================================================
   TEST ENGINE
   ========================================================= */

let currentQuestion=0;

let answers=new Array(questions.length).fill(null);

let submitted=false;

let totalSeconds=90*60;


/* TIMER */

function updateTimer(){

    if(submitted) return;

    let minutes=Math.floor(totalSeconds/60);

    let seconds=totalSeconds%60;

    document.getElementById("timer").textContent=
        String(minutes).padStart(2,"0")+
        ":"+
        String(seconds).padStart(2,"0");

    if(totalSeconds<=0){

        clearInterval(timerInterval);

        submitTest(true);

        return;
    }

    totalSeconds--;

}

const timerInterval=setInterval(updateTimer,1000);


/* SHOW QUESTION */

function showQuestion(){

    const q=questions[currentQuestion];

    document.getElementById("questionCount").textContent=
        "Question "+(currentQuestion+1)+
        " of "+questions.length;

    document.getElementById("question").textContent=q.q;

    const optionsDiv=document.getElementById("options");

    optionsDiv.innerHTML="";

    q.o.forEach(function(option){

        const label=document.createElement("label");

        label.className="option";

        const radio=document.createElement("input");

        radio.type="radio";

        radio.name="answer";

        radio.value=option;

        if(answers[currentQuestion]===option){

            radio.checked=true;

        }

        radio.addEventListener("change",function(){

            answers[currentQuestion]=option;

            createPalette();

        });

        label.appendChild(radio);

        label.appendChild(
            document.createTextNode(option)
        );

        optionsDiv.appendChild(label);

    });

    createPalette();

}


/* PALETTE */

function createPalette(){

    const palette=document.getElementById("palette");

    palette.innerHTML="";

    questions.forEach(function(_,index){

        const button=document.createElement("button");

        button.textContent=index+1;

        if(answers[index]!==null){

            button.classList.add("attempted");

        }

        button.onclick=function(){

            currentQuestion=index;

            showQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        palette.appendChild(button);

    });

}


/* NEXT */

function nextQuestion(){

    if(currentQuestion<questions.length-1){

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* PREVIOUS */

function previousQuestion(){

    if(currentQuestion>0){

        currentQuestion--;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* SUBMIT */

function submitTest(autoSubmit){

    if(submitted) return;

    if(!autoSubmit){

        const confirmation=confirm(
            "Are you sure you want to submit the test?"
        );

        if(!confirmation) return;

    }

    submitted=true;

    clearInterval(timerInterval);

    let correct=0;

    let wrong=0;

    let unattempted=0;

    questions.forEach(function(question,index){

        if(answers[index]===null){

            unattempted++;

        }

        else if(answers[index]===question.a){

            correct++;

        }

        else{

            wrong++;

        }

    });

    let score=correct-(wrong/3);

    document.getElementById("testArea")
        .style.display="none";

    document.getElementById("result")
        .style.display="block";

    document.getElementById("score")
        .textContent=score.toFixed(2);

    document.getElementById("correct")
        .textContent=correct;

    document.getElementById("wrong")
        .textContent=wrong;

    document.getElementById("unattempted")
        .textContent=unattempted;

    showSolutions();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* SOLUTIONS */

function showSolutions(){

    const review=document.getElementById("review");

    review.innerHTML="";

    questions.forEach(function(question,index){

        const div=document.createElement("div");

        let statusClass="";

        let statusText="";

        if(answers[index]===null){

            statusClass="unattempted-review";

            statusText=
                '<span class="unattempted">⚪ Not Attempted</span>';

        }

        else if(answers[index]===question.a){

            statusClass="correct-review";

            statusText=
                '<span class="correct">✓ Correct</span>';

        }

        else{

            statusClass="wrong-review";

            statusText=
                '<span class="wrong">✗ Wrong</span>';

        }

        let userAnswer=
            answers[index]===null
            ?"Not Attempted"
            :answers[index];

        div.className="review "+statusClass;

        div.innerHTML=

            '<div class="review-question">'+
            'Q'+(index+1)+'. '+question.q+
            '</div>'+

            '<div>'+statusText+'</div>'+

            '<div style="margin-top:7px;">'+
            '<b>Your Answer:</b> '+userAnswer+
            '</div>'+

            '<div class="correct-answer">'+
            'Correct Answer: '+question.a+
            '</div>'+

            '<div class="solution">'+
            '<strong>💡 Solution:</strong><br>'+
            question.s+
            '</div>';

        review.appendChild(div);

    });

}


/* INITIAL LOAD */

showQuestion();
