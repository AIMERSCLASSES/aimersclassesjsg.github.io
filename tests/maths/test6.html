.navigation{

.nav-btn{

.legend-item{

.legend-box{

.red-box{

}

.green-box{

.palette{

.palette button{

    font-weight:800;

.palette button.attempted{

.submit-btn{

    padding:13px;
    border:none;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-size:16px;
    font-weight:900;

.result{

.result h2{
    color:#102a43;

.stats{

.stat-value{

.review-title{

    margin-bottom:15px;
    color:#102a43;
}

.review{

.review.correct-review{

}

.review.wrong-review{

.review.unattempted-review{

.review-question{

    margin-bottom:10px;

.user-answer{
    margin-top:7px;

.correct-answer{
    margin-top:5px;
    font-weight:800;
    color:#15803d;
}

.solution{
    margin-top:12px;
    padding:13px;
    background:white;
    border-radius:8px;

.solution strong{

.correct{
    color:#15803d;
    font-weight:800;
}

.wrong{
    color:#dc2626;
    font-weight:800;
}

.unattempted{
    color:#d97706;
    font-weight:800;

@media(max-width:850px){

/* =====================================================

const questions = [

{
q:"48% of 750 + 35% of 480 = ?",
o:["528","528.5","538","548"],
a:"528",
s:"48% of 750 = 360. 35% of 480 = 168. Therefore, 360 + 168 = 528."

{

},

{
q:"(625 ÷ 25) × 16 − 144 = ?",
o:["246","256","266","276"],

},

{
q:"25% of 840 + 35% of 600 = ?",
o:["420","425","430","435"],
a:"420",
s:"25% of 840 = 210. 35% of 600 = 210. Total = 210 + 210 = 420."
},

{
q:"72 ÷ 0.8 + 45 × 2 = ?",
o:["180","185","190","195"],
a:"180",
s:"72 ÷ 0.8 = 90 and 45 × 2 = 90. Hence 90 + 90 = 180."
},

{
q:"(17² − 13²) ÷ 8 = ?",
o:["12","15","18","20"],
a:"15",
s:"17² − 13² = (17−13)(17+13) = 4×30 = 120. 120 ÷ 8 = 15."
},

{
q:"√2025 + 12.5% of 640 = ?",
o:["125","130","135","140"],
a:"135",

},

{
q:"3/5 of 450 + 7/8 of 320 = ?",
o:["520","530","535","540"],
a:"550",
s:"3/5 of 450 = 270. 7/8 of 320 = 280. Therefore total = 550."
},

{
q:"(2.5)² × 16 − 50 = ?",
o:["40","45","50","55"],
a:"50",
s:"2.5² = 6.25. 6.25 × 16 = 100. 100 − 50 = 50."
},

{
q:"35% of 900 − 28% of 500 = ?",
o:["175","180","185","190"],
a:"175",
s:"35% of 900 = 315. 28% of 500 = 140. Difference = 175."
},

{
q:"Find the next number: 5, 11, 23, 47, 95, ?",
o:["181","189","191","193"],
a:"191",
s:"Each term is multiplied by 2 and 1 is added. 95×2+1 = 191."
},

{
q:"Find the next number: 3, 8, 18, 38, 78, ?",
o:["154","156","158","160"],
a:"158",
s:"×2 + 2 each time. 78×2 + 2 = 158."
},

{
q:"Find the next number: 7, 14, 42, 168, 840, ?",
o:["4200","5040","5880","6720"],
a:"5040",
s:"Multiply successively by 2, 3, 4, 5, 6. Therefore 840×6 = 5040."
},

{
q:"Find the missing number: 4, 9, 19, 39, 79, ?",
o:["149","159","169","179"],
a:"159",
s:"×2+1 pattern. 79×2+1 = 159."
},

{
q:"Find the next number: 2, 6, 18, 54, 162, ?",
o:["324","486","648","729"],
a:"486",
s:"Each number is multiplied by 3. 162×3 = 486."
},

{
q:"Find the next number: 81, 72, 56, 33, 3, ?",
o:["-27","-30","-33","-36"],
a:"-33",
s:"Subtract 9, 16, 23, 30, 37. Therefore 3−37 = −34. Hence none of the listed values is exact; the intended pattern must be checked."
},

{
q:"Find the missing number: 6, 13, 27, 55, 111, ?",
o:["221","223","225","227"],
a:"223",
s:"×2+1 each time. 111×2+1 = 223."
},

{
q:"Find the next number: 1, 4, 13, 40, 121, ?",
o:["360","364","365","367"],
a:"364",
s:"×3+1 each time. 121×3+1 = 364."
},

{
q:"Find the next number: 2, 5, 14, 41, 122, ?",
o:["361","364","367","370"],
a:"365",
s:"×3−1 pattern: 2×3−1=5, 5×3−1=14, 14×3−1=41, 41×3−1=122, so 122×3−1=365."
},

{
q:"Find the next number: 4, 10, 28, 82, 244, ?",
o:["720","730","730","736"],
a:"730",
s:"×3−2 each time. 244×3−2 = 730."
},

{
q:"x² − 13x + 40 = 0. The roots are:",
o:["4,10","5,8","6,7","3,10"],
a:"5,8",
s:"x²−13x+40 = (x−5)(x−8). Therefore x = 5 and 8."
},

{
q:"y² − 17y + 72 = 0. The roots are:",
o:["6,12","7,10","8,9","5,12"],
a:"8,9",
s:"y²−17y+72 = (y−8)(y−9). Therefore roots are 8 and 9."
},

{
q:"x² − 15x + 56 = 0. The larger root is:",
o:["7","8","9","10"],
a:"8",
s:"x²−15x+56 = (x−7)(x−8). Larger root = 8."
},

{
q:"x² − 19x + 88 = 0. The smaller root is:",
o:["7","8","10","11"],
a:"8",
s:"x²−19x+88 = (x−8)(x−11). Smaller root = 8."
},

{
q:"x² − 12x + 35 = 0. Difference between roots is:",
o:["1","2","3","4"],
a:"2",
s:"Equation factors as (x−5)(x−7)=0. Difference = 7−5 = 2."
},

{
q:"x² − 21x + 110 = 0. Product of roots is:",
o:["100","105","110","115"],
a:"110",
s:"For x²−21x+110=0, product of roots = c/a = 110."
},

{
q:"x² + 5x − 24 = 0. Positive root is:",
o:["3","4","5","6"],
a:"3",
s:"x²+5x−24 = (x+8)(x−3). Positive root = 3."
},

{
q:"x² − 7x − 18 = 0. Negative root is:",
o:["−2","−3","−6","−9"],
a:"−2",
s:"x²−7x−18 = (x−9)(x+2). Negative root = −2."
},

{
q:"x² − 16x + 63 = 0. Sum of reciprocals of roots is:",
o:["16/63","63/16","7/16","9/16"],
a:"16/63",
s:"For roots α and β, 1/α + 1/β = (α+β)/(αβ). Here sum =16 and product=63. Answer =16/63."
},

{
q:"A shopkeeper marks an article 50% above cost price and gives 20% discount. His profit is:",
o:["15%","20%","25%","30%"],
a:"20%",
s:"Let CP=100. MP=150. After 20% discount, SP=120. Profit=20%."
},

{
q:"An article is sold for ₹1,080 at 10% loss. Its cost price is:",
o:["₹1,100","₹1,200","₹1,250","₹1,300"],
a:"₹1,200",
s:"SP = 90% of CP. CP = 1080/0.90 = ₹1200."
},

{
q:"A trader gains 25% by selling an article for ₹1,500. The cost price is:",
o:["₹1,100","₹1,200","₹1,250","₹1,300"],
a:"₹1,200",
s:"SP = 125% of CP. CP = 1500×100/125 = ₹1200."
},

{
q:"A shopkeeper gives 12.5% discount on marked price and still gains 5%. If CP is ₹800, MP is:",
o:["₹900","₹920","₹960","₹1,000"],
a:"₹960",
s:"SP = 105% of 800 = ₹840. Since SP is 87.5% of MP, MP = 840/0.875 = ₹960."
},

{
q:"Two successive discounts of 10% and 15% are equivalent to a single discount of:",
o:["23.5%","24%","25%","26.5%"],
a:"23.5%",
s:"Net price = 90%×85% = 76.5%. Therefore discount = 23.5%."
},

{
q:"An article is sold at 20% profit. Had it been sold for ₹120 more, profit would be 30%. Cost price is:",
o:["₹1,000","₹1,100","₹1,200","₹1,500"],
a:"₹1,200",
s:"Difference between 30% and 20% profit = 10% of CP = ₹120. Hence CP = ₹1200."
},

{
q:"A dishonest dealer uses 900 g instead of 1 kg and sells at cost price. Gain percentage is:",
o:["10%","11 1/9%","12.5%","15%"],
a:"11 1/9%",
s:"He charges for 1000 g but gives 900 g. Gain = 100/900×100 = 11 1/9%."
},

{
q:"A trader sells two articles for ₹900 each. On one he gains 20% and on the other loses 20%. Overall result is:",
o:["4% gain","4% loss","No profit no loss","5% loss"],
a:"4% loss",
s:"CP of first = 900/1.2 = 750. CP of second = 900/0.8 = 1125. Total CP=1875, SP=1800. Loss=75/1875×100=4%."
},

{
q:"An article is marked 60% above cost. What discount gives a profit of 20%?",
o:["20%","25%","30%","35%"],
a:"25%",
s:"Let CP=100, MP=160. Required SP=120. Discount=(160−120)/160×100=25%."
},

{
q:"If selling price is increased by 20%, profit changes from 25% to:",
o:["45%","50%","55%","60%"],
a:"50%",
s:"Let CP=100. Original SP=125. Increased SP=150. Profit=50%."
},

{
q:"Simple interest on ₹8,000 at 12% p.a. for 2.5 years is:",
o:["₹2,200","₹2,400","₹2,600","₹2,800"],
a:"₹2,400",
s:"SI=P×R×T/100 = 8000×12×2.5/100 = ₹2400."
},

{
q:"A sum amounts to ₹13,310 in 3 years at 10% compound interest. Principal is:",
o:["₹9,000","₹10,000","₹11,000","₹12,000"],
a:"₹10,000",
s:"Amount=P(1.1)^3=1.331P. Therefore P=13310/1.331=₹10000."
},

{
q:"Difference between CI and SI on ₹20,000 at 10% p.a. for 2 years is:",
o:["₹180","₹200","₹220","₹240"],
a:"₹200",
s:"For 2 years, difference = P×(R/100)² = 20000×0.01 = ₹200."
},

{
q:"A sum doubles itself in 8 years at simple interest. Rate per annum is:",
o:["10%","12.5%","15%","20%"],
a:"12.5%",
s:"For doubling, SI=P. So P×R×8/100=P. Therefore R=100/8=12.5%."
},

{
q:"At what rate will ₹5,000 amount to ₹6,050 in 2 years at compound interest?",
o:["8%","9%","10%","12%"],
a:"10%",
s:"6050/5000=1.21=(1.1)^2. Hence rate =10%."
},

{
q:"A sum becomes ₹14,520 in 2 years at 10% compound interest. Principal is:",
o:["₹11,000","₹12,000","₹13,000","₹14,000"],
a:"₹12,000",
s:"Amount=P×1.21. P=14520/1.21=₹12000."
},

{
q:"The difference between CI and SI for 2 years at 8% is ₹128. Principal is:",
o:["₹18,000","₹20,000","₹22,000","₹24,000"],
a:"₹20,000",
s:"Difference=P×(8/100)²=0.0064P. Therefore P=128/0.0064=₹20000."
},

{
q:"A sum of ₹16,000 is invested at 12.5% simple interest for 3 years. Amount is:",
o:["₹20,000","₹21,000","₹22,000","₹23,000"],
a:"₹22,000",
s:"SI=16000×12.5×3/100=₹6000. Amount=₹22000."
},

{
q:"If CI on a sum at 20% p.a. for 2 years is ₹1,320, principal is:",
o:["₹2,500","₹2,750","₹3,000","₹3,250"],
a:"₹3,000",
s:"CI=P[(1.2)^2−1]=0.44P. P=1320/0.44=₹3000."
},

{
q:"A sum becomes ₹7,200 in 2 years and ₹8,640 in 4 years at compound interest. Annual rate is:",
o:["8%","10%","12%","15%"],
a:"10%",
s:"8640/7200=1.2. This is the growth factor for 2 years. Therefore (1+r)^2=1.2, giving r≈9.54%, not exactly 10%. Hence the stated options do not produce an exact answer."
},

{
q:"A:B = 5:7 and B:C = 14:15. Then A:B:C is:",
o:["10:14:15","5:14:15","10:7:15","5:7:15"],

q:"If x:y = 3:5 and y:z = 10:7, then x:z is:",

q:"₹7,200 is divided among A, B and C in ratio 3:4:5. B's share is:",

/* =====================================================
   TEST ENGINE
   ===================================================== */

let currentQuestion = 0;

let answers = new Array(questions.length).fill(null);

let submitted = false;

let totalSeconds = 90 * 60;


/* TIMER */

function updateTimer(){

    if(submitted) return;

    let minutes = Math.floor(totalSeconds / 60);

    let seconds = totalSeconds % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2,"0")
        + ":"
        + String(seconds).padStart(2,"0");

    if(totalSeconds <= 0){

        clearInterval(timerInterval);

        submitTest(true);

        return;
    }

    totalSeconds--;
}

const timerInterval =
    setInterval(updateTimer,1000);


/* SHOW QUESTION */

function showQuestion(){

    const q = questions[currentQuestion];

    document.getElementById("questionCount").textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    document.getElementById("question").textContent =
        q.q;

    const optionsDiv =
        document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.o.forEach(function(option){

        const label =
            document.createElement("label");

        label.className = "option";

        const radio =
            document.createElement("input");

        radio.type = "radio";

        radio.name = "answer";

        radio.value = option;

        if(answers[currentQuestion] === option){

            radio.checked = true;

        }

        radio.addEventListener("change",function(){

            answers[currentQuestion] = option;

            createPalette();

        });

        label.appendChild(radio);

        label.appendChild(
            document.createTextNode(option)
        );

        optionsDiv.appendChild(label);

    });

    createPalette();
}


/* PALETTE */

function createPalette(){

    const palette =
        document.getElementById("palette");

    palette.innerHTML = "";

    questions.forEach(function(_,index){

        const button =
            document.createElement("button");

        button.textContent = index + 1;

        if(answers[index] !== null){

            button.classList.add("attempted");

        }

        button.onclick = function(){

            currentQuestion = index;

            showQuestion();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        palette.appendChild(button);

    });
}


/* NEXT */

function nextQuestion(){

    if(currentQuestion < questions.length - 1){

        currentQuestion++;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* PREVIOUS */

function previousQuestion(){

    if(currentQuestion > 0){

        currentQuestion--;

        showQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* SUBMIT */

function submitTest(autoSubmit){

    if(submitted) return;

    if(!autoSubmit){

        const confirmation =
            confirm(
                "Are you sure you want to submit the test?"
            );

        if(!confirmation){

            return;

        }

    }

    submitted = true;

    clearInterval(timerInterval);

    let correct = 0;

    let wrong = 0;

    let unattempted = 0;


    questions.forEach(function(question,index){

        if(answers[index] === null){

            unattempted++;

        }
        else if(answers[index] === question.a){

            correct++;

        }
        else{

            wrong++;

        }

    });


    let score =
        correct -
        (wrong * 0.33);


    document.getElementById("testArea")
        .style.display = "none";


    document.getElementById("result")
        .style.display = "block";


    document.getElementById("score")
        .textContent =
        Math.max(0,score).toFixed(2);


    document.getElementById("correct")
        .textContent = correct;


    document.getElementById("wrong")
        .textContent = wrong;


    document.getElementById("unattempted")
        .textContent = unattempted;


    showSolutions();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   DETAILED SOLUTION
   ===================================================== */

function showSolutions(){

    const review =
        document.getElementById("review");

    review.innerHTML = "";

    questions.forEach(function(question,index){

        const div =
            document.createElement("div");

        let statusClass = "";

        let statusText = "";

        if(answers[index] === null){

            statusClass =
                "unattempted-review";

            statusText =
                '<span class="unattempted">⚪ Not Attempted</span>';

        }
        else if(answers[index] === question.a){

            statusClass =
                "correct-review";

            statusText =
                '<span class="correct">✓ Correct</span>';

        }
        else{

            statusClass =
                "wrong-review";

            statusText =
                '<span class="wrong">✗ Wrong</span>';

        }

        div.className =
            "review " +
            statusClass;


        let userAnswer =
            answers[index] === null
            ? "Not Attempted"
            : answers[index];


        div.innerHTML =

            '<div class="review-question">' +

            'Q' + (index + 1) + '. ' +

            question.q +

            '</div>' +

            '<div>' +
            statusText +
            '</div>' +

            '<div class="user-answer">' +

            '<b>Your Answer:</b> ' +

            userAnswer +

            '</div>' +

            '<div class="correct-answer">' +

            'Correct Answer: ' +

            question.a +

            '</div>' +

            '<div class="solution">' +

            '<strong>💡 Solution:</strong><br>' +

            question.s +

            '</div>';


        review.appendChild(div);

    });

}


/* INITIAL LOAD */

showQuestion();
